name: Apply GETLINK access model once
on:
  push:
    branches:
      - fix/clarify-access-model
    paths:
      - tools/apply_access_model_once.py
      - .github/workflows/apply-access-model-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clarify-access-model
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply access model and stamp static build
        run: python tools/apply_access_model_once.py
      - name: Commit transformed runtime files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add order-management.js app.js index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: clarify GETLINK guest user admin access"
          git push origin HEAD:fix/clarify-access-model
