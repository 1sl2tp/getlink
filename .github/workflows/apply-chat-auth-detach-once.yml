name: Apply Chat auth detachment once
on:
  push:
    branches:
      - security/detach-chat-auth-v2
    paths:
      - tools/apply_chat_auth_detach.py
      - .github/workflows/apply-chat-auth-detach-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/detach-chat-auth-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hard gates and stamp static build
        run: python tools/apply_chat_auth_detach.py
      - name: Commit transformed runtime files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add order-management.js supabase/functions/getlink-orders/index.ts index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "security: detach Chat bearer auth from GETLINK"
          git push origin HEAD:security/detach-chat-auth-v2
