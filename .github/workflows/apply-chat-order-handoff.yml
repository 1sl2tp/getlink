name: Apply Chat Order Handoff

on:
  push:
    branches:
      - design/chat-order-source-handoff

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chat-order-source-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_chat_order_source_handoff.py
      - run: python tools/stamp_static_build.py
      - run: python -m unittest tests.test_chat_order_source_handoff -v
      - run: python -m unittest tests.test_order_submit_single_owner -v
      - run: node --check order-management.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add order-management.js style.css index.html version.json
          if git diff --cached --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git commit -m "feat: accept chat order source context safely"
          git push origin HEAD:design/chat-order-source-handoff
