name: Apply debt detail view race fix

on:
  push:
    branches:
      - fix/debt-detail-orders-view-race
    paths:
      - .github/workflows/apply-debt-detail-view-race-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-detail-orders-view-race
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
      - name: Install test dependencies
        run: pip install -r scraper/requirements.txt
      - name: Apply view ownership fix
        run: python tools/apply_debt_detail_view_race_fix.py
      - name: Verify focused race contracts
        run: python -m unittest tests.test_mobile_order_view_race -v
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Verify full suite and syntax
        run: |
          python tools/stamp_static_build.py --check
          python -m unittest discover -s tests -v
          node --check order-management.js
          deno check supabase/functions/getlink-orders/index.ts
      - name: Remove one-time applicator
        run: |
          rm .github/workflows/apply-debt-detail-view-race-fix.yml
          rm tools/apply_debt_detail_view_race_fix.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep debt detail async renders scoped to debt view"
          git push origin HEAD:fix/debt-detail-orders-view-race
