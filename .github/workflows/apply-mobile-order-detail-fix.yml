name: Apply mobile order detail fix
permissions:
  contents: write
on:
  push:
    branches: [fix/mobile-order-detail-open]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch layout-transparent results wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('taphoa-workspace-feedback.css')
          s=p.read_text('utf-8')
          rule='.order-report-results{display:contents}\n'
          if rule not in s:
              marker='.order-lifecycle-list[data-taphoa-v2-source="1"]{display:none!important}\n'
              if marker not in s:
                  raise SystemExit('order lifecycle marker not found')
              s=s.replace(marker, marker+'\n/* Keep the stable search/results DOM wrapper layout-transparent so the order workspace remains the sized flex child. */\n'+rule, 1)
              p.write_text(s,'utf-8')
          PY
      - name: Stamp and verify focused regression
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
          python -m unittest tests.test_mobile_orders_scroll_search -v
          python -m unittest tests.test_mobile_order_scroll_focus -v
          python -m unittest tests.test_mobile_standard_document_layout -v
      - name: Commit fix and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-mobile-order-detail-fix.yml
          git add taphoa-workspace-feedback.css tests/test_mobile_orders_scroll_search.py index.html version.json
          git commit -m 'fix: restore mobile order detail geometry'
          git push origin HEAD:fix/mobile-order-detail-open
