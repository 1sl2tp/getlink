name: Apply mobile order row/source fix
permissions:
  contents: write
on:
  push:
    branches: [fix/mobile-order-row-source-complete]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch row tap and complete source catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('order-management.js')
          s=p.read_text('utf-8')

          old='''  function summarizeOrdersBySource(rows=[]){\n    const map=new Map();const total={qty:0,expenseVnd:0,revenue:0,profit:0,costKnown:false};\n'''
          new='''  function supplierSourceCatalog(){\n    try{\n      if(typeof mobileSupplierSources==="function"){\n        const rows=mobileSupplierSources();\n        return Array.isArray(rows)?rows:[];\n      }\n    }catch{}\n    return [];\n  }\n  function summarizeOrdersBySource(rows=[]){\n    const map=new Map();const total={qty:0,expenseVnd:0,revenue:0,profit:0,costKnown:false};\n    for(const sourceRow of supplierSourceCatalog()){\n      const source=String(sourceRow?.key||"").trim();\n      if(!source)continue;\n      const sourceLabel=String(sourceRow?.label||source).trim()||source;\n      map.set(source,{source,sourceLabel,qty:0,expenseVnd:0,revenue:0,profit:0,costKnown:false,orders:new Set()});\n    }\n'''
          if old not in s: raise SystemExit('summarizeOrdersBySource marker not found')
          s=s.replace(old,new,1)

          old='const row=map.get(source)||{source,qty:0,expenseVnd:0,revenue:0,profit:0,costKnown:false,orders:new Set()};'
          new='const row=map.get(source)||{source,sourceLabel:source,qty:0,expenseVnd:0,revenue:0,profit:0,costKnown:false,orders:new Set()};'
          if old not in s: raise SystemExit('source row marker not found')
          s=s.replace(old,new,1)

          old='<span>${escapeHtml(row.source)}</span><span>${row.qty}</span>'
          new='<span>${escapeHtml(row.sourceLabel||row.source)}</span><span>${row.qty}</span>'
          if old not in s: raise SystemExit('source label markup marker not found')
          s=s.replace(old,new,1)

          old='''    const detail=target.closest?.("[data-order-detail]");if(detail){const id=String(detail.dataset.orderId||"");expandedOrderId=expandedOrderId===id?"":id;renderOrders();return;}\n'''
          new='''    const orderCard=target.closest?.(".order-card[data-order-id]");\n    if(orderCard&&!target.closest?.("button,a,input,select,textarea,label")){expandedOrderId=String(orderCard.dataset.orderId||"");renderOrders();return;}\n    const detail=target.closest?.("[data-order-detail]");if(detail){const id=String(detail.dataset.orderId||"");expandedOrderId=expandedOrderId===id?"":id;renderOrders();return;}\n'''
          if old not in s: raise SystemExit('order detail click marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,'utf-8')

          p=Path('taphoa-mobile-standard.js')
          s=p.read_text('utf-8')
          old='const IFRAME_TAP_SELECTOR="#mobileUserWork button,#mobileUserWork [role=\\"button\\"],#mobileStandardCartSheet button,#orderCustomerPicker button";'
          new='const IFRAME_TAP_SELECTOR="#mobileUserWork button,#mobileUserWork [role=\\"button\\"],#mobileUserWork .order-card[data-order-id],#mobileStandardCartSheet button,#orderCustomerPicker button";'
          if old not in s: raise SystemExit('iframe tap selector marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,'utf-8')
          PY
      - name: Stamp and verify focused contracts
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
          python -m unittest tests.test_mobile_order_row_detail_and_sources -v
          python -m unittest tests.test_mobile_orders_scroll_search -v
          python -m unittest tests.test_mobile_order_scroll_focus -v
          python -m unittest tests.test_mobile_standard_document_layout -v
          node --check order-management.js
          node --check taphoa-mobile-standard.js
      - name: Commit fix and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-mobile-order-row-source-fix.yml
          git add order-management.js taphoa-mobile-standard.js tests/test_mobile_order_row_detail_and_sources.py index.html version.json
          git commit -m 'fix: open mobile order rows and show all sources'
          git push origin HEAD:fix/mobile-order-row-source-complete
