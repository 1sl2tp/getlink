name: Apply mobile order row source owner fix
permissions:
  contents: write
on:
  push:
    branches:
      - fix/mobile-order-row-source-owner
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch mobile order owner
        run: python tools/apply_mobile_order_owner_fix.py
      - name: Stamp and verify focused regressions
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
          python -m unittest tests.test_mobile_order_detail_source_owner -v
          python -m unittest tests.test_mobile_orders_scroll_search -v
          python -m unittest tests.test_mobile_order_scroll_focus -v
          python -m unittest tests.test_mobile_standard_document_layout -v
          node --check taphoa-workspace-feedback.js
      - name: Commit fix and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-mobile-order-row-source-owner.yml tools/apply_mobile_order_owner_fix.py
          git add taphoa-workspace-feedback.js tests/test_mobile_order_detail_source_owner.py index.html version.json
          git commit -m 'fix: make mobile order owner direct and complete'
          git push origin HEAD:fix/mobile-order-row-source-owner
