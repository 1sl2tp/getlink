name: Apply mobile order view race fix v2

on:
  push:
    branches:
      - fix/mobile-order-debt-render-race
    paths:
      - .github/workflows/apply-mobile-order-view-race-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'ci: apply mobile order/debt race guard once'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-order-debt-render-race
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch async view ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('order-management.js')
          s=p.read_text(encoding='utf-8')
          old='''  let syncBusy=false;\n  let orders=[];'''
          new='''  let syncBusy=false;\n  let managerRefreshSeq=0;\n  let orders=[];'''
          assert old in s
          s=s.replace(old,new,1)
          old='''  async function refreshDebts(){\n    const list=document.getElementById("orderManagerList");\n    if(list)list.innerHTML='<div class="order-manager-message">Đang tải công nợ...</div>';\n    if(currentRole()==="user"){\n      const id=String(currentAccount()?.id||"");\n      await loadDebtDetail(id);\n      renderDebtDetail();\n      return;\n    }\n    if(debtCustomerId){\n      await loadDebtDetail(debtCustomerId);\n      renderDebtDetail();\n      return;\n    }\n    await loadDebtSummaries();\n    renderDebtSummaries();\n  }'''
          new='''  async function refreshDebts(refreshSeq=managerRefreshSeq,requestedView="debts"){\n    if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;\n    const list=document.getElementById("orderManagerList");\n    if(list)list.innerHTML='<div class="order-manager-message">Đang tải công nợ...</div>';\n    if(currentRole()==="user"){\n      const id=String(currentAccount()?.id||"");\n      await loadDebtDetail(id);\n      if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;\n      renderDebtDetail();\n      return;\n    }\n    if(debtCustomerId){\n      await loadDebtDetail(debtCustomerId);\n      if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;\n      renderDebtDetail();\n      return;\n    }\n    await loadDebtSummaries();\n    if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;\n    renderDebtSummaries();\n  }'''
          assert old in s
          s=s.replace(old,new,1)
          old='''  async function refreshManager(){\n    injectUi();\n    updateIdentity();\n    if(!readAuth()){\n      if(!isEmbeddedInChat()){goToChat();return;}\n      setManagerGate("Đang xác thực qua Chat...");\n      if(!(await waitForChatAuth())){setManagerGate("Cần đăng nhập Chat để tiếp tục.");return;}\n    }\n    clearManagerGate();\n    updateIdentity();\n    if(currentRole()==="admin")void loadCustomers().catch(()=>{});\n    syncManagerView();\n    try{\n      if(activeView==="debts")await refreshDebts();\n      else {await loadOrders();renderOrders();}\n      if(!syncBusy)await checkRemoteRevision(true);\n    }catch(error){\n      if(!handleAuthError(error)){\n        const list=document.getElementById("orderManagerList");\n        if(list)list.innerHTML='<div class="order-manager-message">'+escapeHtml(error?.message||error)+'</div>';\n      }\n    }\n  }'''
          new='''  async function refreshManager(){\n    const refreshSeq=++managerRefreshSeq;\n    const requestedView=activeView;\n    injectUi();\n    updateIdentity();\n    if(!readAuth()){\n      if(!isEmbeddedInChat()){goToChat();return;}\n      setManagerGate("Đang xác thực qua Chat...");\n      if(!(await waitForChatAuth())){\n        if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;\n        setManagerGate("Cần đăng nhập Chat để tiếp tục.");return;\n      }\n    }\n    if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;\n    clearManagerGate();\n    updateIdentity();\n    if(currentRole()==="admin")void loadCustomers().catch(()=>{});\n    syncManagerView();\n    try{\n      if(requestedView==="debts")await refreshDebts(refreshSeq,requestedView);\n      else {await loadOrders();if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;renderOrders();}\n      if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;\n      if(!syncBusy)await checkRemoteRevision(true);\n    }catch(error){\n      if(refreshSeq!==managerRefreshSeq||activeView!==requestedView)return;\n      if(!handleAuthError(error)){\n        const list=document.getElementById("orderManagerList");\n        if(list)list.innerHTML='<div class="order-manager-message">'+escapeHtml(error?.message||error)+'</div>';\n      }\n    }\n  }'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify focused contract
        run: |
          python -m unittest tests.test_mobile_order_view_race tests.test_mobile_orders_canonical_source_detail -v
          node --check order-management.js
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Verify build stamp
        run: python tools/stamp_static_build.py --check
      - name: Remove one-time workflows
        run: rm -f .github/workflows/apply-mobile-order-view-race.yml .github/workflows/apply-mobile-order-view-race-v2.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: guard mobile order/debt render race"
          git push origin HEAD:fix/mobile-order-debt-render-race
