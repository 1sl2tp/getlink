name: Apply mobile pending source summary fix

on:
  push:
    branches:
      - fix/mobile-pending-source-summary-visible
    paths:
      - .github/workflows/apply-mobile-pending-source-summary.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-pending-source-summary-visible
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r scraper/requirements.txt
      - name: Keep mobile source summary sized in canonical scroll owner
        run: |
          cat >> taphoa-workspace-feedback.css <<'CSS'

          @media(max-width:639px){
            /* MOBILE_CANONICAL_ORDER_OWNER_20260914 */
            #mobileUserWork[data-taphoa-view="orders"] .order-source-summary{
              display:block!important;
              flex:0 0 auto!important;
              min-height:max-content;
            }
            #mobileUserWork[data-taphoa-view="orders"] .order-source-detail{
              flex:0 0 auto!important;
            }
          }
          CSS
      - name: Verify focused mobile ownership contracts
        run: |
          python -m unittest tests.test_mobile_order_source_visibility tests.test_mobile_orders_scroll_search tests.test_mobile_order_scroll_focus -v
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Verify full suite and build stamp
        run: |
          python -m unittest discover -s tests -v
          python tools/stamp_static_build.py --check
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-mobile-pending-source-summary.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep mobile pending sources visible"
          git push origin HEAD:fix/mobile-pending-source-summary-visible
