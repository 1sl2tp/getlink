name: Apply mobile standard bootstrap

on:
  push:
    branches:
      - feature/mobile-standard-sales-v2
    paths:
      - .github/workflows/apply-mobile-standard.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-standard-sales-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='''    const orderManagementUrl=runtime.assetUrl("order-management.js",build);'''
          replacement='''    const orderManagementUrl=runtime.assetUrl("order-management.js",build);\n    const mobileStandardCssUrl=runtime.assetUrl("taphoa-mobile-standard.css",build);\n    const mobileStandardUrl=runtime.assetUrl("taphoa-mobile-standard.js",build);'''
          if 'taphoa-mobile-standard.js' not in s:
              if anchor not in s: raise SystemExit('order management asset anchor missing')
              s=s.replace(anchor,replacement,1)
          style_anchor='''      loadStyle("getlinkOrderCustomerCss",orderCustomerCssUrl)\n    ]);'''
          style_replacement='''      loadStyle("getlinkOrderCustomerCss",orderCustomerCssUrl),\n      loadStyle("getlinkMobileStandardCss",mobileStandardCssUrl)\n    ]);'''
          if 'getlinkMobileStandardCss' not in s:
              if style_anchor not in s: raise SystemExit('style bootstrap anchor missing')
              s=s.replace(style_anchor,style_replacement,1)
          script_anchor='''    await loadScript(orderManagementUrl,build);'''
          script_replacement='''    await loadScript(orderManagementUrl,build);\n    await loadScript(mobileStandardUrl,build);'''
          if 'await loadScript(mobileStandardUrl,build);' not in s:
              if script_anchor not in s: raise SystemExit('script bootstrap anchor missing')
              s=s.replace(script_anchor,script_replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify focused mobile contract
        run: |
          python -m unittest tests.test_taphoa_mobile_standard -v
          node --check taphoa-mobile-standard.js
      - name: Stamp static build
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
      - name: Commit generated bootstrap
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-standard.yml
          git add index.html version.json
          git commit -m "build: bootstrap mobile standard sales"
          git push origin HEAD:feature/mobile-standard-sales-v2
