name: Apply order cart live owner once
on:
  push:
    branches:
      - fix/order-cart-live-owner
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-cart-live-owner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply live cart owner fix
        run: python tools/apply_order_cart_live_owner_once.py
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Remove one-shot transformer
        run: |
          rm tools/apply_order_cart_live_owner_once.py
          rm .github/workflows/apply-order-cart-live-owner-once.yml
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep selected cart live and make send responsive"
          git push origin HEAD:fix/order-cart-live-owner
