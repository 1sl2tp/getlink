name: Apply order list detail once
on:
  push:
    branches:
      - fix/order-list-vs-detail
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-list-vs-detail
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply order list/detail hierarchy
        run: |
          python tools/apply_order_list_detail_once.py
          python tools/stamp_static_build.py
      - name: Commit UI hierarchy fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add order-management.js order-management.css index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: separate order list from order detail"
          git push origin HEAD:fix/order-list-vs-detail
