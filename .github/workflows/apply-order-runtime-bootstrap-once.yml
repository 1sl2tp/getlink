name: Apply order runtime bootstrap once
on:
  push:
    branches:
      - fix/load-order-management-runtime
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/load-order-management-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply single-owner order bootstrap
        run: |
          python tools/apply_order_runtime_bootstrap_once.py
          python tools/stamp_static_build.py
      - name: Commit runtime fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config.js app.js index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: load Tạp hóa order runtime after app"
          git push origin HEAD:fix/load-order-management-runtime
