name: Apply order work nav once
on:
  push:
    branches:
      - fix/expose-user-order-manager
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/expose-user-order-manager
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visible order/debt work navigation
        run: |
          python tools/apply_order_work_nav_once.py
          python tools/stamp_static_build.py
      - name: Commit UI fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add order-management.js order-management.css index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose User order and debt manager in work view"
          git push origin HEAD:fix/expose-user-order-manager
