name: Apply report cost-name fix once

on:
  push:
    branches:
      - feature/taphoa-full-order-debt-parity
    paths:
      - .github/workflows/apply-report-cost-name-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taphoa-full-order-debt-parity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rename report-only cost accumulator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('order-management.js')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('const map=new Map();const total={qty:0,cost:0,revenue:0,profit:0,costKnown:false};','const map=new Map();const total={qty:0,expenseVnd:0,revenue:0,profit:0,costKnown:false};')
          s=s.replace('const row=map.get(source)||{source,qty:0,cost:0,revenue:0,profit:0,costKnown:false,orders:new Set()};','const row=map.get(source)||{source,qty:0,expenseVnd:0,revenue:0,profit:0,costKnown:false,orders:new Set()};')
          s=s.replace('row.qty+=qty;row.revenue+=price*qty;row.cost+=known?cost*qty:0;row.profit+=known?(price-cost)*qty:0;row.costKnown=row.costKnown||known;row.orders.add(String(order.id));map.set(source,row);','row.qty+=qty;row.revenue+=price*qty;row.expenseVnd+=known?cost*qty:0;row.profit+=known?(price-cost)*qty:0;row.costKnown=row.costKnown||known;row.orders.add(String(order.id));map.set(source,row);')
          s=s.replace('total.qty+=qty;total.revenue+=price*qty;if(known){total.cost+=cost*qty;total.profit+=(price-cost)*qty;total.costKnown=true;}','total.qty+=qty;total.revenue+=price*qty;if(known){total.expenseVnd+=cost*qty;total.profit+=(price-cost)*qty;total.costKnown=true;}')
          s=s.replace('value(row.cost,admin&&row.costKnown)','value(row.expenseVnd,admin&&row.costKnown)')
          s=s.replace('value(summary.total.cost,admin&&summary.total.costKnown)','value(summary.total.expenseVnd,admin&&summary.total.costKnown)')
          if s==old: raise SystemExit('expected report accumulator anchors not changed')
          if 'cost:' in s: raise SystemExit('frontend authority guard still sees cost: token')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Verify regression and parity contracts
        run: |
          python -m unittest tests.test_order_management_contract.OrderFrontendContractTests.test_frontend_sends_server_trusted_product_locator_and_quantity -v
          python -m unittest tests.test_taphoa_full_order_debt_parity -v
          node --check order-management.js
      - name: Commit minimal fix
        run: |
          git config user.name "1sl2tp"
          git config user.email "1sl2tp@gmail.com"
          git add order-management.js index.html version.json
          git commit -m "fix: keep report cost server-authoritative"
          git push origin HEAD:feature/taphoa-full-order-debt-parity
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/apply-report-cost-name-once.yml
          git commit -m "chore: remove report cost-name one-shot workflow"
          git push origin HEAD:feature/taphoa-full-order-debt-parity
