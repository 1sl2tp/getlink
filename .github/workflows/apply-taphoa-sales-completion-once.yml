name: Apply Tạp hóa sales completion once
on:
  push:
    branches:
      - feature/finish-taphoa-sales-flow
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finish-taphoa-sales-flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply authoritative order-number response
        run: python tools/apply_taphoa_sales_completion_once.py
      - name: Commit transformed backend
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/getlink-orders/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: return authoritative Tạp hóa order number"
          git push origin HEAD:feature/finish-taphoa-sales-flow
