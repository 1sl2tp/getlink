name: Apply Tạp hóa UI UX pass once

on:
  push:
    branches:
      - redesign/taphoa-ui-ux-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/taphoa-ui-ux-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused UI pass
        run: python tools/apply_taphoa_ui_ux_pass_once.py
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Focused tests
        run: python -m unittest tests.test_taphoa_ui_ux_pass -v
      - name: Syntax check
        run: node --check app.js && node --check order-management.js
      - name: Remove temporary transformer and commit
        run: |
          git rm .github/workflows/apply-taphoa-ui-ux-pass-once.yml tools/apply_taphoa_ui_ux_pass_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js order-management.css index.html version.json
          git commit -m "ui: polish Tạp hóa order and debt surfaces"
          git push origin HEAD:redesign/taphoa-ui-ux-pass
