name: Apply Tạp hóa UI UX pass once

on:
  push:
    branches:
      - redesign/taphoa-ui-ux-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/taphoa-ui-ux-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply focused UI pass
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text('utf-8')

          replacements = [
              (
                  '''return '<article class="mobile-user-mine-card mobile-user-product-card '+(mobileMergeTargetUrl===canonical(row.canonical_url)?"merge-selected":"")+'" data-url="'+escapeAttr(row.canonical_url)+'">'+''',
                  '''return '<article class="mobile-user-mine-card mobile-user-product-card '+(mobileMergeTargetUrl===canonical(row.canonical_url)?"merge-selected":"")+(qty>0?" is-selected":"")+'" data-url="'+escapeAttr(row.canonical_url)+'">'+'''
              ),
              (
                  '''return '<article class="mobile-user-mine-card mobile-user-product-card '+(selected?"merge-selected":"")+'" data-url="'+escapeAttr(row.canonical_url)+'">'+''',
                  '''return '<article class="mobile-user-mine-card mobile-user-product-card '+(selected?"merge-selected":"")+(qty>0?" is-selected":"")+'" data-url="'+escapeAttr(row.canonical_url)+'">'+'''
              ),
              (
                  '''return '<div class="user-work-order-row product-card" data-url="'+escapeAttr(row.canonical_url)+'">'+''',
                  '''return '<div class="user-work-order-row product-card '+(qty>0?"is-selected":"")+'" data-url="'+escapeAttr(row.canonical_url)+'">'+'''
              ),
              (
                  '''      if(value)value.textContent=String(next);\n      updateUserWorkOrderSummary();''',
                  '''      if(value)value.textContent=String(next);\n      const selectedSurface=qtyButton.closest(".mobile-user-product-card,.user-work-order-row");\n      if(selectedSurface)selectedSurface.classList.toggle("is-selected",next>0);\n      updateUserWorkOrderSummary();'''
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'app.js expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          app.write_text(text, 'utf-8')

          css = Path('order-management.css')
          current = css.read_text('utf-8')
          marker = '/* UI/UX audit pass: operational density + accessible interaction */'
          if marker in current:
              raise SystemExit('UI/UX audit block already exists')
          block = r'''

/* UI/UX audit pass: operational density + accessible interaction */
.order-manager,
.order-work-nav,
.order-cart-actions{
  --order-touch:44px;
  --order-list-gap:8px;
  --order-focus:#2f6fad;
  --order-selected:#2d7a4d;
}

/* Keep controls physically easy to hit without making the layout visually loose. */
.order-manager-tabs button,
.order-card-detail-toggle,
.order-card-actions button,
.order-work-nav button,
.order-cart-actions button,
#orderManagerClose,
.order-manager-tool-actions button,
.debt-payment-form button,
.debt-payment-form input{
  min-height:var(--order-touch);
}
#orderManagerClose{min-width:var(--order-touch)}

.order-manager button,
.order-work-nav button,
.order-cart-actions button{
  transition:background-color .14s ease,border-color .14s ease,color .14s ease,transform .08s ease;
}
.order-manager button:active,
.order-work-nav button:active,
.order-cart-actions button:active{
  transform:translateY(1px);
}
.order-manager :is(button,input):focus-visible,
.order-work-nav button:focus-visible,
.order-cart-actions button:focus-visible{
  outline:2px solid var(--order-focus);
  outline-offset:2px;
}

/* Selection is visible in-place; no toast or full rerender is needed after +/- taps. */
.mobile-user-product-card.is-selected,
.user-work-order-row.is-selected{
  border-color:#9fc6ad!important;
  background:#f3faf6!important;
  box-shadow:inset 3px 0 0 var(--order-selected)!important;
}
.mobile-user-product-card.is-selected .mobile-user-product-name,
.user-work-order-row.is-selected .user-work-order-name strong{
  color:#185b37;
}

/* One order = one visual unit. The order number leads; amount is the second anchor. */
.order-card{
  border-radius:9px;
  box-shadow:none;
}
.order-card-head strong{
  font-size:15px;
  font-weight:750;
  letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;
}
.order-card-head>b{
  font-size:15px;
  font-weight:750;
  font-variant-numeric:tabular-nums;
}
.order-card-head small{
  color:#697482;
  font-size:12px;
}
.order-card-detail-toggle{
  color:#2f618d;
  font-size:12px;
}

/* Empty/error surfaces stay quiet instead of becoming another card. */
.order-manager-empty,
.order-manager-message{
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  color:#697482;
}

/* Debt hierarchy: customer first, balance second, transaction history after. */
.debt-customer-card,
.debt-detail-head,
.debt-txn{
  border-radius:9px;
  box-shadow:none;
}
.debt-customer-card strong,
.debt-txn-main strong{
  font-size:13px;
  font-weight:700;
}
.debt-customer-card>b,
.debt-detail-head>b,
.debt-txn-main>b{
  font-variant-numeric:tabular-nums;
}

@media(max-width:639px){
  .order-manager{--order-list-gap:6px}
  .order-manager-panel{
    box-shadow:0 -6px 20px rgba(25,33,45,.12);
  }
  .order-manager-list{
    gap:var(--order-list-gap);
    padding:6px 8px max(12px,env(safe-area-inset-bottom));
  }
  .order-manager-head{min-height:60px}
  .order-card-head{padding:9px 10px 8px}
  .order-card-items{padding:4px 10px}
  .order-card-actions{padding:5px 8px 7px}
  .order-work-nav.mobile{padding-top:4px}
  .order-card-detail-toggle,
  .order-card-actions button,
  .order-work-nav button,
  .order-cart-actions button,
  .order-manager-tabs button{
    min-height:var(--order-touch);
  }
}

@media(prefers-reduced-motion:reduce){
  .order-manager button,
  .order-work-nav button,
  .order-cart-actions button{
    transition:none!important;
    transform:none!important;
  }
}
'''
          css.write_text(current.rstrip() + block + '\n', 'utf-8')
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Focused tests
        run: python -m unittest tests.test_taphoa_ui_ux_pass -v
      - name: Syntax check
        run: node --check app.js && node --check order-management.js
      - name: Remove one-off workflow and commit
        run: |
          git rm .github/workflows/apply-taphoa-ui-ux-pass-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js order-management.css index.html version.json
          git commit -m "ui: polish Tạp hóa order and debt surfaces"
          git push origin HEAD:redesign/taphoa-ui-ux-pass
