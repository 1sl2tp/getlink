name: Build unified sales foundation once

on:
  push:
    branches: [unified-sales-foundation]
    paths:
      - ".github/workflows/build-unified-sales-foundation-once.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: pip install -r scraper/requirements.txt
      - name: Implement shared account and sales runtime
        run: python tools/apply_unified_sales_foundation.py
      - name: Targeted unified sales tests
        run: python -m unittest tests.test_unified_sales_auth_contract tests.test_unified_sales_order_contract -v
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Full GETLINK verification
        run: |
          python tools/stamp_static_build.py --check
          python -m unittest discover -s tests -v
          python -W error::SyntaxWarning -m py_compile scraper/scraper.py scraper/brightdata_bhx.py scraper/brightdata_go.py .github/scripts/build_news_snapshot.py
          node --check app.js
          node --check relay/src/index.js
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          deno check supabase/functions/getlink-api/index.ts
      - name: Commit verified foundation
        run: |
          git config user.name "GETLINK Sales Foundation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/build-unified-sales-foundation-once.yml tools/apply_unified_sales_foundation.py
          git add app.js style.css index.html version.json supabase/functions/getlink-api/index.ts supabase/migrations/20260910143000_unified_sales_core.sql tests/test_unified_sales_auth_contract.py tests/test_unified_sales_order_contract.py docs/superpowers
          git commit -m "Add shared Chat account sales foundation"
          git push origin HEAD:unified-sales-foundation
