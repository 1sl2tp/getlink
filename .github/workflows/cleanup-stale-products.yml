name: Cleanup stale GETLINK rows

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-products.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
      TOKEN: ${{ secrets.GETLINK_GITHUB_TOKEN }}

    steps:
      - name: Wait for Worker deploy
        run: |
          set -euo pipefail
          sleep 25

      - name: Cleanup rows rejected by current ingestion rules
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          curl --silent --show-error --fail             -H "Authorization: Bearer $TOKEN"             -H "Content-Type: application/json"             -X POST             "$API/api/cleanup-ingestion-rules"             > /tmp/cleanup.json
          cat /tmp/cleanup.json | jq .
          test "$(jq -r '.ok' /tmp/cleanup.json)" = "true"

      - name: Verify no stale visible rows remain
        run: |
          set -euo pipefail
          curl --silent --show-error --fail             "$API/api/library?view=search&limit=2000&include_hidden=1"             > /tmp/library.json

          node <<'NODE'
          const fs=require("fs");
          const data=JSON.parse(fs.readFileSync("/tmp/library.json","utf8"));
          const rows=Array.isArray(data.products)?data.products:[];

          const plain=v=>String(v||"")
            .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
            .replace(/đ/gi,"d")
            .toLowerCase()
            .replace(/\s+/g," ")
            .trim();

          const urlIsCarton=value=>{
            try{
              const u=new URL(String(value||""));
              const slug=u.pathname.split("/").filter(Boolean).pop()||"";
              return /^thung(?:-|$)/.test(slug)||/-thung$/.test(slug);
            }catch{return false}
          };

          const mixedUnits="thung|loc|tui|bich|chai|hop|goi|can|lon|hu|ly|to|khoanh|thanh|cay|vien|tuyp";
          const bad=[];

          for(const row of rows){
            const name=plain(row.name);
            const packaging=plain(row.packaging);
            const authoritative=
              /^thung\b/.test(name)||
              /^thung\b/.test(packaging)||
              urlIsCarton(row.canonical_url);

            let reason="";
            if(/^combo\b/.test(name))reason="combo";
            else if(/^[0-9]+(?:[.,][0-9]+)?\s+thung\b/.test(name))reason="multi_carton";
            else if(new RegExp("\\bva\\s+[0-9]+(?:[.,][0-9]+)?\\s+("+mixedUnits+")\\b").test(name))reason="mixed_bundle";
            else if(/^[0-9]+(?:[.,][0-9]+)?\b/.test(name)&&!authoritative)reason="numeric_prefix";

            if(reason)bad.push({reason,name:row.name,url:row.canonical_url});
          }

          console.log("VISIBLE_PRODUCTS="+rows.length);
          console.log("STALE_VISIBLE="+bad.length);
          if(bad.length){
            console.log(JSON.stringify(bad.slice(0,30),null,2));
            process.exit(1);
          }
          NODE
