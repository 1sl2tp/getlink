name: Deploy 1988 NewPipe Relay

permissions:
  contents: read

concurrency:
  group: deploy-1988-newpipe-relay-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "relay-youtube-wasm/**"
      - ".github/workflows/deploy-1988-newpipe-relay.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Wrangler
        run: |
          npm install -g wrangler@4.129.1
          wrangler --version

      - name: Syntax check
        run: node --check relay-youtube-wasm/src/index.js

      - name: Create worker config
        run: |
          cat > relay-youtube-wasm/wrangler.toml <<EOF
          name = "youtube-wasm-relay-1988"
          main = "src/index.js"
          compatibility_date = "2026-09-23"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          EOF

      - name: Deploy relay
        run: |
          set -euo pipefail
          wrangler deploy --config relay-youtube-wasm/wrangler.toml 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$URL"
          echo "RELAY_URL=$URL" >> "$GITHUB_ENV"
          echo "Relay: $URL"

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            HTTP="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$RELAY_URL/health" || true)"
            if [ "$HTTP" = "200" ] && jq -e '.ok == true' /tmp/health.json >/dev/null 2>&1; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/health.json || true
          exit 1

      - name: Smoke NewPipe WASM in Chrome
        run: |
          set -euo pipefail
          sleep 20
          mkdir -p /tmp/np
          curl -fsSL 'https://raw.githubusercontent.com/thegrims/newpipe-extractor-wasm/main/browser-wrapper/webdemo/browser-wrapper.wasm-runtime.js' -o /tmp/np/browser-wrapper.wasm-runtime.js
          curl -fsSL 'https://raw.githubusercontent.com/thegrims/newpipe-extractor-wasm/main/browser-wrapper/webdemo/browser-wrapper.wasm' -o /tmp/np/browser-wrapper.wasm
          cat >/tmp/np/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <script src="browser-wrapper.wasm-runtime.js"></script>
          <pre id="out">loading</pre>
          <script>
          (async()=>{
            const q=new URLSearchParams(location.search);
            const relay=q.get('relay');
            const t=performance.now();
            try {
              const teavm=await TeaVM.wasmGC.load('browser-wrapper.wasm');
              const media=String(teavm.exports.getFirstProgressiveStreamUrl(relay,'https://www.youtube.com/watch?v=dQw4w9WgXcQ'));
              document.getElementById('out').textContent=JSON.stringify({
                ok: media.startsWith('https://') && media.includes('/media?'),
                ms: Math.round(performance.now()-t),
                media
              });
            } catch(e) {
              document.getElementById('out').textContent=JSON.stringify({ok:false,error:String(e)});
            }
          })();
          </script>
          HTML
          cd /tmp/np
          python3 -m http.server 8934 >/tmp/http.log 2>&1 &
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          RELAY_BASE="$RELAY_URL/?url="
          ENC="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$RELAY_BASE")"
          timeout 40s "$CHROME" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage             --virtual-time-budget=30000 "http://127.0.0.1:8934/?relay=$ENC" --dump-dom > /tmp/dom.html
          sed -n 's/.*<pre id="out">\([^<]*\).*/\1/p' /tmp/dom.html > /tmp/result.txt
          cat /tmp/result.txt
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/result.txt'))
          assert r.get('ok') is True, r
          assert r.get('ms',99999) < 15000, r
          open('/tmp/media-url.txt','w').write(r['media'])
          PY

      - name: Smoke refreshed media range
        run: |
          set -euo pipefail
          MEDIA_URL="$(cat /tmp/media-url.txt)"
          curl -fsSL --max-time 25 -H 'Range: bytes=0-65535' -D /tmp/media.headers "$MEDIA_URL" -o /tmp/media.bin
          cat /tmp/media.headers
          FIRST="$(head -1 /tmp/media.headers | tr -d '\r')"
          echo "FIRST=$FIRST"
          BYTES="$(wc -c </tmp/media.bin)"
          echo "BYTES=$BYTES"
          test "$BYTES" -ge 1024
          grep -Eiq '^content-range:' /tmp/media.headers
          grep -Eiq '^accept-ranges: *bytes' /tmp/media.headers
