name: Deploy 1988 NewPipe Relay

permissions:
  contents: read

concurrency:
  group: deploy-1988-newpipe-relay-main
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "relay-youtube-wasm/**"
      - ".github/workflows/deploy-1988-newpipe-relay.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Wrangler
        run: |
          npm install -g wrangler@4.129.1
          wrangler --version

      - name: Syntax check
        run: node --check relay-youtube-wasm/src/index.js

      - name: Create worker config
        run: |
          cat > relay-youtube-wasm/wrangler.toml <<EOF
          name = "youtube-wasm-relay-1988"
          main = "src/index.js"
          compatibility_date = "2026-09-23"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          EOF

      - name: Deploy relay
        run: |
          set -euo pipefail
          wrangler deploy --config relay-youtube-wasm/wrangler.toml 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$URL"
          echo "RELAY_URL=$URL" >> "$GITHUB_ENV"
          echo "Relay: $URL"

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            HTTP="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$RELAY_URL/health" || true)"
            if [ "$HTTP" = "200" ] && jq -e '.ok == true' /tmp/health.json >/dev/null 2>&1; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/health.json || true
          exit 1

      - name: Probe exact NewPipe clients
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 "$RELAY_URL/probe-direct?id=dQw4w9WgXcQ" -o /tmp/direct.json
          cat /tmp/direct.json
          echo
          jq -e '.results | length >= 1' /tmp/direct.json >/dev/null

      - name: Smoke direct DASH manifest and ranges
        run: |
          set -euo pipefail
          MANIFEST="$RELAY_URL/direct/manifest?id=dQw4w9WgXcQ&h=480"
          curl -fsSL --max-time 30 -D /tmp/manifest.headers "$MANIFEST" -o /tmp/manifest.mpd
          cat /tmp/manifest.headers
          head -c 1200 /tmp/manifest.mpd
          echo
          grep -q '<MPD' /tmp/manifest.mpd
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/manifest.mpd').getroot()
          ns={'m':'urn:mpeg:dash:schema:mpd:2011'}
          urls=[(x.text or '').strip() for x in root.findall('.//m:BaseURL',ns)]
          assert len(urls)>=2, urls
          open('/tmp/video-url.txt','w').write(urls[0])
          open('/tmp/audio-url.txt','w').write(urls[1])
          print('VIDEO_URL_HOST',urls[0].split('/')[2])
          print('AUDIO_URL_HOST',urls[1].split('/')[2])
          PY
          for KIND in video audio; do
            URL="$(cat /tmp/$KIND-url.txt)"
            echo "=== $KIND RANGE ==="
            curl -fsSL --max-time 30 -H 'Range: bytes=0-65535' -D "/tmp/$KIND.headers" "$URL" -o "/tmp/$KIND.bin"
            cat "/tmp/$KIND.headers"
            STATUS="$(head -1 "/tmp/$KIND.headers" | tr -d '\r')"
            BYTES="$(wc -c <"/tmp/$KIND.bin")"
            echo "STATUS=$STATUS BYTES=$BYTES"
            grep -Eiq '^content-range: *bytes ' "/tmp/$KIND.headers"
            grep -Eiq '^accept-ranges: *bytes' "/tmp/$KIND.headers"
            test "$BYTES" -ge 1024
            test "$BYTES" -le 131072
          done
