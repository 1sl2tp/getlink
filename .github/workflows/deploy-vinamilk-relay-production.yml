name: Deploy VNM Relay Preview

permissions:
  contents: read

concurrency:
  group: deploy-vnm-relay-preview
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/vinamilk-source-rsc
    paths:
      - "relay/**"
      - ".github/workflows/deploy-vinamilk-relay-production.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g wrangler@4.129.1
      - run: node --check relay/src/index.js

      - name: Create preview config
        run: |
          cat > relay/wrangler-vnm-preview.toml <<EOF
          name = "getlink-vinamilk-relay-preview"
          main = "src/index.js"
          compatibility_date = "2026-09-08"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          EOF

      - name: Upload relay auth secret when configured
        run: |
          set -euo pipefail
          if [ -n "${RELAY_SHARED_SECRET:-}" ]; then
            printf '%s' "$RELAY_SHARED_SECRET" | wrangler secret put RELAY_SHARED_SECRET --config relay/wrangler-vnm-preview.toml >/dev/null
          fi

      - name: Deploy preview
        run: |
          set -euo pipefail
          wrangler deploy --config relay/wrangler-vnm-preview.toml 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/deploy.log | tail -1)"
          test -n "$URL"
          echo "RELAY_URL=$URL" >> "$GITHUB_ENV"

      - name: Health check
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 2 "$RELAY_URL/health" >/tmp/health.json
          jq -e '.ok == true and .d1 == false' /tmp/health.json >/dev/null

      - name: Smoke BHX
        run: |
          set -euo pipefail
          KEY="${RELAY_SHARED_SECRET:-supabase-bhx-v1}"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            -H "x-getlink-relay: $KEY" \
            -H 'content-type: application/json' \
            -X POST "$RELAY_URL/bhx" \
            --data '{"op":"getCate","categoryUrl":"sua-tuoi","pageSize":10}' > /tmp/bhx.json
          jq -e '.code == 0 and .data != null and (.data.products|length)>0' /tmp/bhx.json >/dev/null

      - name: Smoke VNM direct GraphQL
        run: |
          set -euo pipefail
          KEY="${RELAY_SHARED_SECRET:-supabase-bhx-v1}"
          QUERY='query GetEShopProductSelectors($payload: eshop_getSearchProductRequest!) { eshop_searchProducts(payload: $payload) { total items { variantId price { price originPrice } } } }'
          BODY="$(jq -nc --arg q "$QUERY" '{operationName:"GetEShopProductSelectors",variables:{payload:{collectionHandle:"sua-tuoi",offset:0,size:1,sortType:"RELEVANCE"}},query:$q}')"
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            -H "x-getlink-relay: $KEY" \
            -H 'content-type: application/json' \
            -X POST "$RELAY_URL/vinamilk" \
            --data "$BODY" > /tmp/vnm.json
          jq '{ok,upstream_status,total:.data.eshop_searchProducts.total,price:.data.eshop_searchProducts.items[0].price.price}' /tmp/vnm.json
          jq -e '.ok == true and .upstream_status == 200 and (.data.eshop_searchProducts.total|tonumber)>0 and (.data.eshop_searchProducts.items|length)>0 and (.data.eshop_searchProducts.items[0].price.price|tonumber)>0' /tmp/vnm.json >/dev/null
