name: Deploy GETLINK Worker

on:
  workflow_dispatch:
    inputs:
      allowed_origins:
        description: "Origin được phép gọi API"
        required: true
        default: "https://1sl2tp.github.io"
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GETLINK_GITHUB_TOKEN: ${{ secrets.GETLINK_GITHUB_TOKEN }}
      ALLOWED_ORIGINS: ${{ inputs.allowed_origins }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Kiểm tra secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Thiếu CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Thiếu CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$GETLINK_GITHUB_TOKEN" || (echo "Thiếu GETLINK_GITHUB_TOKEN" && exit 1)

      - name: Cài Wrangler
        run: npm install -g wrangler@latest

      - name: Tạo hoặc dùng D1 getlink-db
        id: d1
        run: |
          DB_ID="$(wrangler d1 list --json | jq -r '.[] | select(.name=="getlink-db") | .uuid' | head -1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            wrangler d1 create getlink-db --location apac
            DB_ID="$(wrangler d1 list --json | jq -r '.[] | select(.name=="getlink-db") | .uuid' | head -1)"
          fi
          test -n "$DB_ID" || (echo "Không lấy được D1 database id" && exit 1)
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Sinh cấu hình Worker
        env:
          DB_ID: ${{ steps.d1.outputs.db_id }}
        run: |
          cat > worker/wrangler.toml <<EOF
          name = "getlink-api"
          main = "src/index.js"
          compatibility_date = "2026-09-07"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [vars]
          ALLOWED_ORIGINS = "$ALLOWED_ORIGINS"

          [[d1_databases]]
          binding = "DB"
          database_name = "getlink-db"
          database_id = "$DB_ID"
          EOF

      - name: Tạo bảng D1
        run: wrangler d1 execute getlink-db --remote --file worker/schema.sql --config worker/wrangler.toml

      - name: Deploy Worker và secret GitHub
        run: |
          printf 'GITHUB_TOKEN=%s\n' "$GETLINK_GITHUB_TOKEN" > /tmp/getlink-worker-secrets.env
          wrangler deploy --config worker/wrangler.toml --secrets-file /tmp/getlink-worker-secrets.env 2>&1 | tee /tmp/getlink-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/getlink-deploy.log | tail -1)"
          test -n "$WORKER_URL" || (echo "Không đọc được Worker URL" && exit 1)
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Ghi Worker URL cho GitHub Pages
        run: |
          printf 'window.GETLINK_API_BASE="%s";\n' "$WORKER_URL" > config.js
          git config user.name "getlink-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config.js
          if git diff --cached --quiet; then
            echo "config.js không thay đổi"
            exit 0
          fi
          git commit -m "config: connect GETLINK Worker"
          git push origin HEAD:main

      - name: Kiểm tra health
        run: |
          sleep 2
          curl --fail --silent "$WORKER_URL/health"
