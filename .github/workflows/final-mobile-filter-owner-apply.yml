name: Apply final mobile filter owner

permissions:
  contents: write

on:
  push:
    branches:
      - fix/mobile-standard-order-filter-owner

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-standard-order-filter-owner
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scraper/requirements.txt
      - run: python tools/apply_final_mobile_filter_owner.py
      - run: python tools/stamp_static_build.py
      - run: python -m unittest tests.test_mobile_order_filter_owner_final -v
      - run: python -m unittest tests.test_mobile_standard_document_layout -v
      - run: python -m unittest tests.test_mobile_canonical_owner_audit -v
      - run: python -m unittest discover -s tests -v
      - run: node --check order-management.js
      - run: node --check taphoa-mobile-standard.js
      - run: python tools/stamp_static_build.py --check
      - name: Commit final mobile filter owner repair
        run: |
          rm -f tools/apply_final_mobile_filter_owner.py .github/workflows/final-mobile-filter-owner-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: stabilize mobile order filter ownership"
          git push origin HEAD:fix/mobile-standard-order-filter-owner
