name: Fix news image relevance once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-news-image-relevance-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: pip install -r scraper/requirements.txt
      - name: RED evidence
        run: |
          set +e
          python -m unittest tests.test_news_image_relevance -v > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected image relevance regression test to fail before fix"
            exit 1
          fi
      - name: Patch snapshot and reader image ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('.github/scripts/build_news_snapshot.py')
          s=p.read_text(encoding='utf-8')
          old='''    if re.search(r"\\.(?:svg|ico|woff2?|ttf|otf|css|js|json|pdf|xml)(?:[?#]|$)",low):return ""\n    return value\n'''
          new='''    if re.search(r"\\.(?:svg|ico|woff2?|ttf|otf|css|js|json|pdf|xml)(?:[?#]|$)",low):return ""\n    # Structural noise observed in publisher pages: tiny profile thumbs such as\n    # 48x48, decorative left/center/right slices and document-converter bg images.\n    tiny=re.search(r"/thumb/(\\d{1,3})x(\\d{1,3})(?:/|$)",low)\n    if tiny and max(int(tiny.group(1)),int(tiny.group(2)))<240:return ""\n    if re.search(r"/image/images/(?:left|center|right|top|bottom)\\.(?:png|jpe?g|webp)(?:[?#]|$)",low):return ""\n    if re.search(r"/docconvert/images/(?:bg|background)\\d*[-_.][^/?#]*\\.(?:png|jpe?g|webp)(?:[?#]|$)",low):return ""\n    width=re.search(r"[?&](?:w|width)=(\\d{1,3})(?:&|$)",low)\n    height=re.search(r"[?&](?:h|height)=(\\d{1,3})(?:&|$)",low)\n    if width and height and max(int(width.group(1)),int(height.group(1)))<240:return ""\n    return value\n'''
          if old not in s: raise SystemExit('snapshot ready_image_url anchor missing')
          s=s.replace(old,new,1)
          start=s.index('def meta_images(text,base):')
          end=s.index('def article_host(base):',start)
          replacement='''def meta_images(text,base):\n    out=[]\n    def add(value):\n        u=ready_image_url(urllib.parse.urljoin(base,html.unescape(str(value or ""))))\n        if u and u not in out:out.append(u)\n    # Only explicit social article-image metadata is trusted. Generic image,\n    # thumbnail, image_src and preload tags frequently point at publisher chrome.\n    for tag in re.findall(r"<meta\\b[^>]*>",text,re.I):\n        km=re.search(r'\\b(?:property|name)=["\\']([^"\\']+)["\\']',tag,re.I)\n        cm=re.search(r'\\bcontent=["\\']([^"\\']+)["\\']',tag,re.I)\n        key=km.group(1).lower() if km else ""\n        if key not in {"og:image","og:image:url","og:image:secure_url","twitter:image","twitter:image:src"} or not cm:continue\n        add(cm.group(1))\n    return out\n'''
          s=s[:start]+replacement+s[end:]
          # Prefer figure/picture/paragraph-owned images; direct decorative DIV images are unsafe.
          anchor='''def page_images(text,base):\n    out=[]\n    root=article_soup(text,base)\n    if root is not None:\n        strip_article_noise(root,base)\n        try:nodes=root.select("figure,picture,img,amp-img")\n        except Exception:nodes=[]\n        for tag in nodes:\n            u=image_from_tag(tag,base)\n'''
          repl='''def page_images(text,base):\n    out=[]\n    root=article_soup(text,base)\n    if root is not None:\n        strip_article_noise(root,base)\n        try:nodes=root.select("figure,picture,img,amp-img")\n        except Exception:nodes=[]\n        for tag in nodes:\n            name=str(getattr(tag,"name","") or "").lower()\n            parent=str(getattr(getattr(tag,"parent",None),"name","") or "").lower()\n            if name in ("img","amp-img") and parent not in ("figure","picture","p"):continue\n            u=image_from_tag(tag,base)\n'''
          if anchor not in s: raise SystemExit('snapshot page_images anchor missing')
          s=s.replace(anchor,repl,1)
          p.write_text(s,encoding='utf-8')

          p=Path('supabase/functions/getlink-api/index.ts')
          s=p.read_text(encoding='utf-8')
          old='''  if(NEWS_BAD_IMAGE_FRAGMENTS.some((fragment)=>low.includes(fragment)))return "";\n  if(/\\.(?:svg|ico|woff2?|ttf|otf|css|js|json|pdf|xml)(?:[?#]|$)/i.test(low))return "";\n  return url;\n}\n'''
          new='''  if(NEWS_BAD_IMAGE_FRAGMENTS.some((fragment)=>low.includes(fragment)))return "";\n  if(/\\.(?:svg|ico|woff2?|ttf|otf|css|js|json|pdf|xml)(?:[?#]|$)/i.test(low))return "";\n  // Structural publisher chrome seen in production: 48x48 author thumbnails,\n  // image/images/left|center|right slices and docconvert bg images.\n  const tiny=low.match(/\\/thumb\\/(\\d{1,3})x(\\d{1,3})(?:\\/|$)/);\n  if(tiny&&Math.max(Number(tiny[1])||0,Number(tiny[2])||0)<240)return "";\n  if(/\\/image\\/images\\/(?:left|center|right|top|bottom)\\.(?:png|jpe?g|webp)(?:[?#]|$)/i.test(low))return "";\n  if(/\\/docconvert\\/images\\/(?:bg|background)\\d*[-_.][^/?#]*\\.(?:png|jpe?g|webp)(?:[?#]|$)/i.test(low))return "";\n  const width=low.match(/[?&](?:w|width)=(\\d{1,3})(?:&|$)/);\n  const height=low.match(/[?&](?:h|height)=(\\d{1,3})(?:&|$)/);\n  if(width&&height&&Math.max(Number(width[1])||0,Number(height[1])||0)<240)return "";\n  return url;\n}\n'''
          if old not in s: raise SystemExit('edge usable image anchor missing')
          s=s.replace(old,new,1)
          start=s.index('function newsMetaImageValues(html:string,base:string){')
          end=s.index('function newsArticleNoiseText',start)
          replacement='''function newsMetaImageValues(html:string,base:string){\n  const values:string[]=[];\n  const add=(value:unknown)=>{\n    const url=newsUsableImageUrl(value,base);\n    if(url&&!values.includes(url))values.push(url);\n  };\n  const doc=newsArticleDocument(html);\n  if(doc){\n    for(const node of doc.querySelectorAll('meta[property="og:image"],meta[property="og:image:url"],meta[name="twitter:image"],meta[name="twitter:image:src"]')){\n      add(node.getAttribute?.("content")||"");\n    }\n  }\n  return values;\n}\n'''
          s=s[:start]+replacement+s[end:]
          anchor='''function newsArticleBlocks(html:string,base:string){\n'''
          helper='''function newsImageNodeIsArticleOwned(node:any){\n  const tag=String(node?.tagName||"").toLowerCase();\n  if(tag==="figure"||tag==="picture")return true;\n  if(tag!=="img"&&tag!=="amp-img")return false;\n  const parent=String(node?.parentNode?.tagName||node?.parentElement?.tagName||"").toLowerCase();\n  return parent==="figure"||parent==="picture"||parent==="p";\n}\n'''
          if anchor not in s: raise SystemExit('edge blocks function missing')
          s=s.replace(anchor,helper+anchor,1)
          old='''    }else{\n      const url=newsImageCandidateFromNode(node,base);\n'''
          new='''    }else{\n      if(!newsImageNodeIsArticleOwned(node))continue;\n      const url=newsImageCandidateFromNode(node,base);\n'''
          if old not in s: raise SystemExit('edge blocks image branch missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: GREEN targeted regression
        run: python -m unittest tests.test_news_image_relevance tests.test_news_image_quality tests.test_news_image_ownership -v
      - name: Full verification
        run: |
          python tools/stamp_static_build.py --check
          python -m unittest discover -s tests -v
          python -W error::SyntaxWarning -m py_compile scraper/scraper.py scraper/brightdata_bhx.py scraper/brightdata_go.py .github/scripts/build_news_snapshot.py
          node --check app.js
          node --check relay/src/index.js
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          deno check supabase/functions/getlink-api/index.ts
      - name: Commit verified fix
        run: |
          git config user.name "GETLINK News Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-news-image-relevance-once.yml
          git add .github/scripts/build_news_snapshot.py supabase/functions/getlink-api/index.ts tests/test_news_image_relevance.py
          git commit -m "Fix news image relevance and ownership"
          git push origin HEAD:main
