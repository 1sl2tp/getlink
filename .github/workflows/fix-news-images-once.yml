name: Fix generic news images once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-news-images-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch news image quality rules
        run: python .github/scripts/fix_news_images_once.py

      - name: Install project test dependencies
        run: pip install -r scraper/requirements.txt

      - name: Regression test
        run: python -m unittest tests.test_news_image_quality

      - name: Stamp static build
        run: python tools/stamp_static_build.py

      - name: Full unit suite
        run: python -m unittest discover -s tests -v

      - name: Static build check
        run: python tools/stamp_static_build.py --check

      - name: JavaScript syntax check
        run: node --check app.js

      - name: HTML script check
        run: node tools/check-script.js index.html

      - name: Runtime TypeScript check
        run: node tools/check-runtime-ts.js supabase/functions/getlink-api/index.ts

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-news-images-once.yml .github/scripts/fix_news_images_once.py
          git add app.js index.html version.json .github/scripts/build_news_snapshot.py supabase/functions/getlink-api/index.ts tests/test_news_image_quality.py
          git commit -m "Filter generic images from news cards and reader"
          git push
