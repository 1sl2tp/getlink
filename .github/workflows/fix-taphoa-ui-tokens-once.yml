name: Fix Tạp hóa UI tokens once

on:
  push:
    branches:
      - redesign/taphoa-ui-ux-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/taphoa-ui-ux-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply final token fix
        run: python tools/fix_taphoa_ui_tokens_once.py
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Focused tests
        run: python -m unittest tests.test_taphoa_ui_ux_pass -v
      - name: Remove temporary files and commit
        run: |
          git rm .github/workflows/fix-taphoa-ui-tokens-once.yml tools/fix_taphoa_ui_tokens_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add order-management.css index.html version.json
          git commit -m "ui: finish shared interaction tokens"
          git push origin HEAD:redesign/taphoa-ui-ux-pass
