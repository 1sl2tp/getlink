name: Implement standard actions

on:
  push:
    branches:
      - feature/taphoa-standard-actions
    paths:
      - .github/workflows/implement-standard-actions.yml
      - tools/implement_standard_actions.py

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taphoa-standard-actions
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: denoland/setup-deno@v2

      - name: Install project test dependencies
        run: pip install -r scraper/requirements.txt

      - name: Confirm contract is RED
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_taphoa_standard_actions -v > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -q "FAIL" /tmp/red.log

      - name: Preserve JavaScript regex literals in patch helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/implement_standard_actions.py')
          s=p.read_text(encoding='utf-8')
          old="s, count = re.subn(r'function hydrate\\(\\)\\{.*?\\}\\n  function persist', hydrate + '\\n  function persist', s, count=1, flags=re.S)"
          new="s, count = re.subn(r'function hydrate\\(\\)\\{.*?\\}\\n  function persist', lambda _m: hydrate + '\\n  function persist', s, count=1, flags=re.S)"
          if old not in s:
              raise SystemExit('hydrate subn anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Apply standard actions
        run: python tools/implement_standard_actions.py

      - name: Preserve established snapshot contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          debt=Path('taphoa-desktop-debts.js')
          s=debt.read_text(encoding='utf-8')
          anchor='\n\n  async function payment(form)'
          if anchor not in s:
              raise SystemExit('quick-payment compatibility anchor missing')
          adapter='\n  async function quickPayment(form){return quickEntry(form,"payment")}\n\n  async function payment(form)'
          debt.write_text(s.replace(anchor,adapter,1),encoding='utf-8')

          edge=Path('supabase/functions/getlink-orders/index.ts')
          s=edge.read_text(encoding='utf-8')
          old='requested.push({url,qty,bargainPriceVnd,lineNote,nameOverride,sellingPriceVnd});'
          new='requested.push({url,qty,bargainPriceVnd,lineNote:clean(entry?.lineNote),nameOverride,sellingPriceVnd});'
          if old not in s:
              raise SystemExit('line-note snapshot anchor missing')
          edge.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          python -m unittest tests.test_taphoa_standard_actions -v
          node --check taphoa-desktop-sales.js
          node --check taphoa-desktop-debts.js
          deno check supabase/functions/getlink-orders/index.ts
          node tests/test_taphoa_desktop_hot_paths.mjs
          node tests/test_taphoa_desktop_layout_v2.mjs

      - name: Verify full test suite
        run: python -m unittest discover -s tests -v

      - name: Stamp static build
        shell: bash
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-standard-actions.yml
          git rm -f tools/implement_standard_actions.py
          git add taphoa-desktop-sales.js taphoa-desktop-debts.js taphoa-desktop-workspace.css supabase/functions/getlink-orders/index.ts supabase/migrations/20260914050000_getlink_manual_debt_adjustment.sql tests/test_taphoa_standard_actions.py index.html version.json
          git commit -m "feat: complete standard sales and debt actions"
          git push origin HEAD:feature/taphoa-standard-actions
