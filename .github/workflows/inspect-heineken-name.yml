name: Audit Heineken canonical name

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-heineken-name.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API: "https://getlink-api.taphoa-4ab8161d.workers.dev"

    steps:
      - name: Force GETLINK beer category
        run: |
          set -euo pipefail
          RESPONSE="$(curl --silent --show-error --fail             -H "Content-Type: application/json"             --data '{"url":"https://bachhoaxanh.com/bia","force":true}'             "$API/api/get-price")"
          echo "$RESPONSE" | jq .
          REQUEST_ID="$(echo "$RESPONSE" | jq -r '.request_id // empty')"
          test -n "$REQUEST_ID"
          echo "REQUEST_ID=$REQUEST_ID" >> "$GITHUB_ENV"

      - name: Wait for completion
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            RESPONSE="$(curl --silent --show-error --fail               "$API/api/result?id=$REQUEST_ID")"
            STATUS="$(echo "$RESPONSE" | jq -r '.status // empty')"
            echo "[$i] $STATUS"
            if [ "$STATUS" = "complete" ]; then
              echo "$RESPONSE" > /tmp/result.json
              jq '{status,payload:{schema_version:.payload.schema_version,filter_summary:.payload.filter_summary}}' /tmp/result.json
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              echo "$RESPONSE" | jq .
              exit 1
            fi
            sleep 5
          done
          exit 1

      - name: Verify canonical Heineken title and hierarchy
        run: |
          set -euo pipefail
          curl --silent --show-error --fail             "$API/api/library?view=products&parent=https%3A%2F%2Fbachhoaxanh.com%2Fbia&limit=500&include_hidden=1"             > /tmp/beer.json

          jq '[.products[] | select(.canonical_url|ascii_downcase|contains("thung-24-lon-bia-heineken-silver-330ml")) | {
            name,pack_label_1,pack_qty_1,pack_label_2,pack_qty_2,pack_label_3,pack_qty_3,current_price
          }]' /tmp/beer.json

          MATCH="$(jq '[.products[] | select(
            (.canonical_url|ascii_downcase|contains("thung-24-lon-bia-heineken-silver-330ml"))
            and (.name=="Thùng 24 lon Bia Heineken Silver 330ml")
            and (.pack_label_1=="Thùng")
            and ((.pack_qty_1|tonumber)==1)
            and (.pack_label_2=="Lon")
            and ((.pack_qty_2|tonumber)==24)
            and ((.pack_label_3 // "")=="")
            and ((.pack_qty_3 // 0 | tonumber)==0)
          )] | length' /tmp/beer.json)"

          test "$MATCH" -eq 1
          echo "PASS: canonical Heineken title preserved; promo label did not overwrite it."
