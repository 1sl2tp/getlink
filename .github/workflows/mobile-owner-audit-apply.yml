name: Apply mobile owner audit

permissions:
  contents: write

on:
  push:
    branches:
      - feature/mobile-standard-owner-audit

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-standard-owner-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_mobile_owner_audit.py
      - run: python tools/stamp_static_build.py
      - run: python -m unittest tests.test_mobile_standard_owner_audit -v
      - run: python -m unittest tests.test_mobile_standard_document_layout -v
      - run: python -m unittest discover -s tests -v
      - run: node --check order-management.js
      - run: node --check taphoa-mobile-standard.js
      - run: python tools/stamp_static_build.py --check
      - name: Commit audited mobile owner repair
        run: |
          rm -f tools/apply_mobile_owner_audit.py .github/workflows/mobile-owner-audit-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: align mobile owners with standard layout"
          git push origin HEAD:feature/mobile-standard-owner-audit
