name: Refresh READY news snapshots

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/build_news_snapshot.py"
      - ".github/workflows/news-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: getlink-ready-news-snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - topic: latest
            limit: 100
            candidates: 180
          - topic: chinh-tri
            limit: 60
            candidates: 100
          - topic: phap-luat
            limit: 60
            candidates: 100
          - topic: kinh-te
            limit: 60
            candidates: 100
          - topic: tap-hoa
            limit: 60
            candidates: 100
          - topic: cong-nghe
            limit: 60
            candidates: 90
          - topic: the-thao
            limit: 60
            candidates: 90
          - topic: giai-tri
            limit: 60
            candidates: 90
          - topic: suc-khoe
            limit: 60
            candidates: 90
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Google News RSS processor
        run: python -m pip install --quiet feedparser googlenewsdecoder==0.1.7 ftfy==6.3.1 beautifulsoup4==4.12.3

      - name: Build Google News candidate snapshot
        run: |
          mkdir -p /tmp/getlink-news
          python .github/scripts/build_news_snapshot.py             --topic "${{ matrix.topic }}"             --output "/tmp/getlink-news/${{ matrix.topic }}-candidate.json"             --limit "${{ matrix.limit }}"             --candidate-limit "${{ matrix.candidates }}"

      - name: Resolve URLs, clean titles and require thumbnails
        run: |
          python .github/scripts/build_news_snapshot.py             --topic "${{ matrix.topic }}"             --input "/tmp/getlink-news/${{ matrix.topic }}-candidate.json"             --output "/tmp/getlink-news/${{ matrix.topic }}.json"             --enrich-only             --limit "${{ matrix.limit }}"             --candidate-limit "${{ matrix.candidates }}"

      - name: Validate READY topic
        run: |
          python - <<'PY'
          import json, pathlib, os
          topic=os.environ["TOPIC"]
          path=pathlib.Path(f"/tmp/getlink-news/{topic}.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          items=data.get("items") or []
          assert data.get("phase")=="rich" and data.get("ready") is True
          assert items
          for item in items:
              assert item.get("title")
              assert item.get("image")
              assert "news.google.com/" not in str(item.get("url") or "")
          print(topic, "READY", len(items))
          PY
        env:
          TOPIC: ${{ matrix.topic }}

      - name: Upload READY topic
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ matrix.topic }}
          path: /tmp/getlink-news/${{ matrix.topic }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all READY topics
        uses: actions/download-artifact@v4
        with:
          pattern: news-*
          path: /tmp/getlink-ready
          merge-multiple: true

      - name: Validate complete READY set
        run: |
          python - <<'PY'
          import json, pathlib
          topics=["latest","chinh-tri","phap-luat","kinh-te","tap-hoa","cong-nghe","the-thao","giai-tri","suc-khoe"]
          root=pathlib.Path("/tmp/getlink-ready")
          for topic in topics:
              path=root/f"{topic}.json"
              assert path.exists(), topic
              data=json.loads(path.read_text(encoding="utf-8"))
              items=data.get("items") or []
              assert data.get("phase")=="rich" and data.get("ready") is True, topic
              assert items, topic
              assert all(x.get("title") and x.get("image") and "news.google.com/" not in str(x.get("url") or "") for x in items), topic
              print(topic, len(items))
          PY

      - name: Publish complete READY set atomically
        run: |
          git config user.name "GETLINK News Cache"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan news-cache-publish
          git rm -rf .
          mkdir -p news
          cp /tmp/getlink-ready/*.json news/
          echo "{\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"phase\":\"rich\",\"ready\":true,\"topics\":9,\"history\":false,\"database\":false,\"discovery\":\"google-news-rss-only\"}" > news/meta.json
          git add news/*.json
          git commit -m "Refresh READY Google News snapshots"
          git push --force origin HEAD:news-cache
