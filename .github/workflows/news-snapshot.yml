name: Refresh hot news snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/build_news_snapshot.py"
      - ".github/workflows/news-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: getlink-hot-news-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Google News RSS processor
        run: python -m pip install --quiet feedparser googlenewsdecoder==0.1.7 ftfy==6.3.1 beautifulsoup4==4.12.3

      - name: Preserve snapshot builder
        run: cp .github/scripts/build_news_snapshot.py /tmp/build_news_snapshot.py

      - name: Build Google News discovery snapshot
        run: python /tmp/build_news_snapshot.py --output /tmp/getlink-news/latest-fast.json --limit 100

      - name: Resolve article URLs and thumbnails
        run: python /tmp/build_news_snapshot.py --input /tmp/getlink-news/latest-fast.json --output /tmp/getlink-news/latest.json --enrich-only --limit 100

      - name: Publish complete snapshot atomically
        run: |
          git config user.name "GETLINK News Cache"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan news-cache-publish
          git rm -rf .
          mkdir -p news
          cp /tmp/getlink-news/latest.json news/latest.json
          printf '%s\n' "{\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"phase\":\"rich\",\"history\":false,\"database\":false,\"discovery\":\"google-news-rss-only\"}" > news/meta.json
          git add news/latest.json news/meta.json
          git commit -m "Refresh Google News snapshot"
          git push --force origin HEAD:news-cache
