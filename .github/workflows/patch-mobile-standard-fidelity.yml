name: Patch mobile standard fidelity

permissions:
  contents: write

on:
  push:
    branches:
      - feature/mobile-standard-doc-layout

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-standard-doc-layout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch mobile fidelity flow
        run: |
          python - <<'PY'
          from pathlib import Path

          js=Path('taphoa-mobile-standard.js')
          text=js.read_text('utf-8')

          old='''  function customerMarkup(){\n    return '<section id="'+CUSTOMER_ID+'" class="mobile-standard-customer" aria-label="Khách hàng">'+\n      '<button type="button" class="mobile-standard-customer-button" data-order-customer-select aria-label="Chọn khách hàng">'+\n        '<span class="mobile-standard-customer-copy"><small>Khách hàng</small><strong data-mobile-standard-customer-label>Chọn khách</strong></span>'+\n        '<span class="mobile-standard-customer-arrow" aria-hidden="true">›</span>'+\n      '</button>'+\n    '</section>';\n  }'''
          new='''  function customerMarkup(){\n    return '<section id="'+CUSTOMER_ID+'" class="mobile-standard-customer" aria-label="Khách hàng">'+\n      '<button type="button" class="mobile-standard-customer-search" data-mobile-standard-action="customer-search">Tìm khách: tên / SĐT / mã</button>'+\n      '<button type="button" class="mobile-standard-customer-selected" data-order-customer-select aria-label="Khách đã chọn">Chọn khách</button>'+\n    '</section>';\n  }'''
          if old not in text: raise SystemExit('customerMarkup anchor not found')
          text=text.replace(old,new,1)

          old='''  function configureOrderTabs(){\n    const orderTabs=document.getElementById("orderManagerTabs");\n    const pending=orderTabs?.querySelector('[data-order-status="pending"]');\n    const delivered=orderTabs?.querySelector('[data-order-status="delivered"]');\n    if(orderTabs&&pending&&delivered&&delivered.nextElementSibling!==pending){\n      orderTabs.insertBefore(delivered,pending);\n    }\n  }'''
          new='''  function configureOrderTabs(){\n    const orderTabs=document.getElementById("orderManagerTabs");\n    const pending=orderTabs?.querySelector('[data-order-status="pending"]');\n    const delivered=orderTabs?.querySelector('[data-order-status="delivered"]');\n    if(orderTabs&&pending&&delivered&&delivered.nextElementSibling!==pending){\n      orderTabs.insertBefore(delivered,pending);\n    }\n  }\n\n  function moveOrderReportControls(){\n    const host=root();\n    const tabs=document.getElementById("orderManagerTabs");\n    const list=document.getElementById("orderManagerList");\n    const all=[...document.querySelectorAll("#orderManager .order-report-controls")];\n    if(!tabs||!tabs.parentElement)return false;\n    if(!isMobile()||host?.dataset.taphoaView!=="orders"){\n      all.forEach(controls=>{if(controls.parentElement!==list)controls.remove();});\n      return false;\n    }\n    if(!all.length)return false;\n    const controls=all[all.length-1];\n    all.slice(0,-1).forEach(node=>node.remove());\n    if(controls.parentElement!==tabs.parentElement||controls.nextElementSibling!==tabs){\n      tabs.parentElement.insertBefore(controls,tabs);\n    }\n    return true;\n  }'''
          if old not in text: raise SystemExit('configureOrderTabs anchor not found')
          text=text.replace(old,new,1)

          old='''  function syncCustomer(){\n    const standard=document.querySelector("#"+CUSTOMER_ID+" [data-order-customer-select]");\n    if(!standard)return;\n    const source=document.querySelector('[data-order-customer-for="mobileUserSendOrder"]');\n    const label=standard.querySelector("[data-mobile-standard-customer-label]");\n    if(source){\n      standard.hidden=source.hidden;\n      if(label)label.textContent=clean(source.textContent).replace(/^Khách\\s*·\\s*/i,"")||"Chọn khách";\n      standard.title=source.title||"Chọn khách hàng";\n    }else if(label&&!clean(label.textContent))label.textContent="Chọn khách";\n  }'''
          new='''  function syncCustomer(){\n    const standard=document.querySelector("#"+CUSTOMER_ID+" [data-order-customer-select]");\n    const search=document.querySelector("#"+CUSTOMER_ID+" [data-mobile-standard-action=\\"customer-search\\"]");\n    if(!standard)return;\n    const source=document.querySelector('[data-order-customer-for="mobileUserSendOrder"]');\n    if(source){\n      standard.hidden=source.hidden;\n      standard.textContent=clean(source.textContent).replace(/^Khách\\s*·\\s*/i,"")||"Chọn khách";\n      standard.title=source.title||"Chọn khách hàng";\n    }else if(!clean(standard.textContent))standard.textContent="Chọn khách";\n    if(search)search.hidden=standard.hidden;\n  }'''
          if old not in text: raise SystemExit('syncCustomer anchor not found')
          text=text.replace(old,new,1)

          old='''    moveWorkNavToBottom();configureOrderTabs();syncDebtSearch();'''
          new='''    moveWorkNavToBottom();configureOrderTabs();moveOrderReportControls();syncDebtSearch();'''
          if old not in text: raise SystemExit('syncView anchor not found')
          text=text.replace(old,new,1)

          old='''      const name=String(action.dataset.mobileStandardAction||"");\n      if(name==="cart"){event.preventDefault();openCart();return;}'''
          new='''      const name=String(action.dataset.mobileStandardAction||"");\n      if(name==="customer-search"){\n        event.preventDefault();\n        document.querySelector("#"+CUSTOMER_ID+" [data-order-customer-select]")?.click();\n        queueAfterAsyncOwner();\n        return;\n      }\n      if(name==="cart"){event.preventDefault();openCart();return;}'''
          if old not in text: raise SystemExit('click action anchor not found')
          text=text.replace(old,new,1)

          old='''  document.addEventListener("getlink-access-change",()=>queueAfterAsyncOwner());'''
          new='''  document.addEventListener("change",event=>{\n    if(event.target?.closest?.(".order-report-controls"))queueAfterAsyncOwner();\n  });\n\n  document.addEventListener("getlink-access-change",()=>queueAfterAsyncOwner());'''
          if old not in text: raise SystemExit('change listener anchor not found')
          text=text.replace(old,new,1)
          js.write_text(text,'utf-8')

          css=Path('taphoa-mobile-standard.css')
          text=css.read_text('utf-8')
          old='''  .mobile-standard-customer:not([hidden]){\n    display:block;\n    padding:8px 8px 0;\n    background:#fff;\n  }\n  .mobile-standard-customer-button{\n    width:100%;min-height:48px;padding:7px 12px;\n    border:1px solid var(--mobile-standard-line);border-radius:10px;background:#fff;\n    display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:var(--mobile-standard-text)\n  }\n  .mobile-standard-customer-copy{min-width:0;display:grid;gap:2px}\n  .mobile-standard-customer-copy small{font-size:10px;color:var(--mobile-standard-muted)}\n  .mobile-standard-customer-copy strong{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .mobile-standard-customer-arrow{font-size:24px;color:#7b8490;line-height:1}'''
          new='''  .mobile-standard-customer:not([hidden]){\n    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;\n    padding:8px 8px 0;background:#fff;\n  }\n  .mobile-standard-customer button{\n    min-height:46px;padding:0 11px;border:1px solid var(--mobile-standard-line);border-radius:8px;background:#fff;color:var(--mobile-standard-text)\n  }\n  .mobile-standard-customer-search{min-width:0;text-align:left;font-size:13px;font-weight:500;color:var(--mobile-standard-muted)!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .mobile-standard-customer-selected{max-width:132px;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'''
          if old not in text: raise SystemExit('customer css anchor not found')
          text=text.replace(old,new,1)

          old='''  .order-report-controls{padding:7px 8px!important;gap:6px!important}'''
          new='''  .order-report-controls{padding:7px 8px!important;gap:6px!important;border-bottom:1px solid #e7eaed!important;background:#fff!important}'''
          if old not in text: raise SystemExit('order report css anchor not found')
          text=text.replace(old,new,1)
          css.write_text(text,'utf-8')
          PY
      - name: Focused contract and syntax
        run: |
          node --check taphoa-mobile-standard.js
          python -m unittest tests.test_mobile_standard_document_layout -v
          python -m unittest tests.test_mobile_user_work_v46 -v
      - name: Stamp static build
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
      - name: Recheck after stamp
        run: |
          node --check taphoa-mobile-standard.js
          python -m unittest tests.test_mobile_standard_document_layout -v
      - name: Commit patch and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-mobile-standard-fidelity.yml
          git add taphoa-mobile-standard.js taphoa-mobile-standard.css index.html version.json tests/test_mobile_standard_document_layout.py
          git commit -m 'fix: align mobile customer and order sequence'
          git push origin HEAD:feature/mobile-standard-doc-layout
