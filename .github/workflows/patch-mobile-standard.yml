name: Patch mobile standard bootstrap

permissions:
  contents: write

on:
  push:
    branches:
      - feature/mobile-standard-doc-layout

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-standard-doc-layout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch bootstrap and build ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          text=index.read_text('utf-8')
          old='''    const orderCustomerCssUrl=runtime.assetUrl("order-customer-picker.css",build);\n    const orderManagementUrl=runtime.assetUrl("order-management.js",build);\n    await loadScript(configUrl,build);'''
          new='''    const orderCustomerCssUrl=runtime.assetUrl("order-customer-picker.css",build);\n    const orderManagementUrl=runtime.assetUrl("order-management.js",build);\n    const mobileStandardCssUrl=runtime.assetUrl("taphoa-mobile-standard.css",build);\n    const mobileStandardJsUrl=runtime.assetUrl("taphoa-mobile-standard.js",build);\n    await loadScript(configUrl,build);'''
          if old not in text:
              raise SystemExit('index bootstrap const anchor not found')
          text=text.replace(old,new,1)
          old='''      loadStyle("getlinkOrderCss",orderCssUrl),\n      loadStyle("getlinkOrderCustomerCss",orderCustomerCssUrl)\n    ]);\n    await loadScript(orderManagementUrl,build);'''
          new='''      loadStyle("getlinkOrderCss",orderCssUrl),\n      loadStyle("getlinkOrderCustomerCss",orderCustomerCssUrl),\n      loadStyle("getlinkMobileStandardCss",mobileStandardCssUrl)\n    ]);\n    await loadScript(orderManagementUrl,build);\n    await loadScript(mobileStandardJsUrl,build);'''
          if old not in text:
              raise SystemExit('index bootstrap load anchor not found')
          index.write_text(text.replace(old,new,1),'utf-8')

          stamp=Path('tools/stamp_static_build.py')
          text=stamp.read_text('utf-8')
          old="    'taphoa-hot-path-runtime.js','taphoa-hot-path-runtime.css'\n)"
          new="    'taphoa-hot-path-runtime.js','taphoa-hot-path-runtime.css',\n    'taphoa-mobile-standard.js','taphoa-mobile-standard.css'\n)"
          if old not in text:
              raise SystemExit('stamp ASSETS anchor not found')
          text=text.replace(old,new,1)
          old="'taphoa-hot-path-runtime.js','taphoa-hot-path-runtime.css'],"
          new="'taphoa-hot-path-runtime.js','taphoa-hot-path-runtime.css','taphoa-mobile-standard.js','taphoa-mobile-standard.css'],"
          if old not in text:
              raise SystemExit('stamp payload anchor not found')
          stamp.write_text(text.replace(old,new,1),'utf-8')
          PY
      - name: Focused RED-GREEN contract
        run: |
          node --check taphoa-mobile-standard.js
          python -m unittest tests.test_mobile_standard_document_layout -v
          python -m unittest tests.test_mobile_user_work_v46 -v
      - name: Stamp static build
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
      - name: Recheck contract after stamp
        run: |
          python -m unittest tests.test_mobile_standard_document_layout -v
          node --check taphoa-mobile-standard.js
      - name: Commit implementation and self-remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-mobile-standard.yml
          git add index.html version.json tools/stamp_static_build.py taphoa-mobile-standard.js taphoa-mobile-standard.css tests/test_mobile_standard_document_layout.py .github/workflows/verify.yml docs/superpowers/plans/2026-09-14-mobile-standard-doc-layout.md
          git commit -m 'feat: align mobile workflow to standard document'
          git push origin HEAD:feature/mobile-standard-doc-layout
