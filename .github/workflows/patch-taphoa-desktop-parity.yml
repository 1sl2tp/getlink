name: Patch fresh Tạp hóa desktop parity

on:
  push:
    branches:
      - feature/taphoa-desktop-three-column-rebuild

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taphoa-desktop-three-column-rebuild
          fetch-depth: 0
      - name: Patch shared order actions and parity styles
        run: |
          python - <<'PY'
          from pathlib import Path

          orders=Path('taphoa-desktop-orders.js')
          text=orders.read_text('utf-8')
          old='window.TaphoaDesktopOrders={mount,activate,deactivate,refresh,renderSourceRail,renderOrderList,renderOrderRows,renderOrderDetail,selectOrder,batchCurrentOrders,get state(){return state}};'
          new='window.TaphoaDesktopOrders={mount,activate,deactivate,refresh,renderSourceRail,renderOrderList,renderOrderRows,renderOrderDetail,selectOrder,batchCurrentOrders,actionMarkup,performAction:mutate,get state(){return state}};'
          if old in text:
              text=text.replace(old,new,1)
              orders.write_text(text,'utf-8')
          elif new not in text:
              raise SystemExit('Orders export anchor changed')

          css=Path('taphoa-desktop-workspace.css')
          styles=css.read_text('utf-8')
          marker='/* TAPHOA_DESKTOP_PARITY_CONTROLS_20260914 */'
          if marker not in styles:
              styles += '''\n\n/* TAPHOA_DESKTOP_PARITY_CONTROLS_20260914 */
          @media (min-width:1000px){
            .taphoa-order-custom-range{
              display:grid;
              grid-template-columns:repeat(2,minmax(0,1fr));
              gap:6px;
              padding-top:1px;
            }
            .taphoa-order-custom-range[hidden]{display:none!important}
            .taphoa-order-custom-range label{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px}
            .taphoa-order-custom-range small{font-size:9px;color:#77827b;white-space:nowrap}
            .taphoa-order-custom-range input{min-width:0;height:30px;border:1px solid #d6dfda;border-radius:6px;background:#fff;padding:0 6px;font:inherit;font-size:10px}
            .taphoa-order-list-summary-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0}
            .taphoa-order-batch{height:26px;padding:0 8px;border:1px solid #e5c5c5;border-radius:6px;background:#fff;color:#9b3d3d;font:inherit;font-size:9.5px;font-weight:700;cursor:pointer;white-space:nowrap}
            .taphoa-order-batch:hover{background:#fff6f6}

            .taphoa-debt-txn{padding:0;cursor:default;overflow:hidden}
            .taphoa-debt-txn-select{width:100%;min-width:0;padding:8px 10px 4px;border:0;background:transparent;color:inherit;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;font:inherit;cursor:pointer}
            .taphoa-debt-txn-select>span:first-child{min-width:0;display:grid;gap:2px}
            .taphoa-debt-txn-select strong{font-size:11.5px}
            .taphoa-debt-txn-select small{font-size:9.5px;color:#77827b}
            .taphoa-debt-txn-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 7px}
            .taphoa-debt-txn-foot .taphoa-debt-after{min-width:0;flex:1;grid-column:auto;margin:0}
            .taphoa-debt-order-link{flex:0 0 auto;min-height:26px;padding:0 7px;border:1px solid #d5e3da;border-radius:6px;background:#fff;color:#176b3b;font:inherit;font-size:9.5px;font-weight:700;cursor:pointer}
            .taphoa-debt-order-link:hover{background:#f0f7f3}
            .taphoa-linked-order-back{padding:7px 12px;border-bottom:1px solid #edf0ee;background:#fafcfa}
            .taphoa-linked-order-back button{min-height:30px;padding:0 9px;border:1px solid #d6dfda;border-radius:6px;background:#fff;color:#405047;font:inherit;font-size:10px;font-weight:700;cursor:pointer}
          }
          '''
              css.write_text(styles,'utf-8')
          PY
      - name: Commit parity patch when changed
        run: |
          if git diff --quiet -- taphoa-desktop-orders.js taphoa-desktop-workspace.css; then
            echo 'Parity patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taphoa-desktop-orders.js taphoa-desktop-workspace.css
          git commit -m 'feat: share order lifecycle with debt drill-down'
          git push origin HEAD:feature/taphoa-desktop-three-column-rebuild
