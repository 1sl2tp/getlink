name: Patch TAPHOA Order Flow

on:
  push:
    branches:
      - feature/taphoa-order-flow-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taphoa-order-flow-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verify requirements
        run: pip install -r scraper/requirements.txt
      - name: Apply scoped production patch
        run: |
          python tools/patch_taphoa_order_flow.py
          python tools/patch_taphoa_order_return_state.py
      - name: Focused RED to GREEN contract
        run: python -m unittest tests.test_taphoa_order_flow_polish -v
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Syntax check
        run: node --check order-management.js
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Commit GREEN production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add order-management.js order-management.css index.html version.json
          git diff --cached --check
          git commit -m "fix: streamline TAPHOA order browsing flow"
          git push origin HEAD:feature/taphoa-order-flow-polish
