name: Patch zero-price bargain orders

on:
  push:
    branches:
      - fix/taphoa-zero-price-order
    paths:
      - tools/patch_zero_price_bargain.py
      - tests/test_taphoa_zero_price_bargain.py
      - tests/test_taphoa_order_workflow_parity.py
      - .github/workflows/patch-zero-price-bargain.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/taphoa-zero-price-order
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verify requirements
        run: pip install -r scraper/requirements.txt
      - name: Apply scoped production patch
        run: python tools/patch_zero_price_bargain.py
      - name: Focused RED to GREEN contract
        run: python -m unittest tests.test_taphoa_zero_price_bargain -v
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Syntax checks
        run: |
          node --check app.js
          node --check order-management.js
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Commit GREEN production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js order-management.js supabase/functions/getlink-orders/index.ts supabase/migrations/20260911043000_getlink_order_bargain_snapshot.sql index.html version.json
          git commit -m "fix: allow zero-price orders and snapshot bargain price"
          git push origin HEAD:fix/taphoa-zero-price-order
