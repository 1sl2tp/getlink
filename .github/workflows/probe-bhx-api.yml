name: Probe BHX direct API

on:
  push:
    paths:
      - ".github/workflows/probe-bhx-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test GETLINK BHX direct path
        shell: bash
        run: |
          set -uo pipefail
          API='https://getlink-api.taphoa-4ab8161d.workers.dev'

          probe () {
            label="$1"
            url="$2"
            echo "=== $label ==="
            start="$(date +%s%3N)"
            code="$(curl -sS --connect-timeout 20 --max-time 90               -D "/tmp/$label.headers"               -o "/tmp/$label.body" -w '%{http_code}'               -H 'Origin: https://get.taphoa.xyz'               -H 'Content-Type: application/json'               -X POST "$API/api/get-price"               --data "$(jq -nc --arg url "$url" '{url:$url,force:true}')" || true)"
            end="$(date +%s%3N)"
            echo "HTTP=$code ms=$((end-start))"
            echo "--- headers ---"
            cat "/tmp/$label.headers" || true
            echo "--- body ---"
            if jq -e . "/tmp/$label.body" >/dev/null 2>&1; then
              jq . "/tmp/$label.body"
            else
              head -c 4000 "/tmp/$label.body" || true
              echo
            fi

            if [ "$code" = "202" ]; then
              rid="$(jq -r '.request_id // empty' "/tmp/$label.body")"
              if [ -n "$rid" ]; then
                for i in $(seq 1 100); do
                  sleep 1
                  curl -sS                     -H 'Origin: https://get.taphoa.xyz'                     "$API/api/result?id=$rid" > "/tmp/$label-result.json"
                  status="$(jq -r '.status // empty' "/tmp/$label-result.json")"
                  if [ "$status" = "complete" ] || [ "$status" = "error" ]; then
                    echo "--- final ---"
                    jq '{status,engine,error,products:(.payload.products|length?)}' "/tmp/$label-result.json"
                    break
                  fi
                done
              fi
            fi
          }

          probe product             'https://www.bachhoaxanh.com/hat-nem/bot-ngot-ajinomoto-1kg-cl'

          probe category             'https://www.bachhoaxanh.com/hat-nem'

          exit 0
