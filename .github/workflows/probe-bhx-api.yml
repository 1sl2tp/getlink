name: Probe BHX direct API

on:
  push:
    paths:
      - ".github/workflows/probe-bhx-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test GETLINK BHX direct path
        shell: bash
        run: |
          set -euo pipefail
          API='https://getlink-api.taphoa-4ab8161d.workers.dev'

          probe () {
            label="$1"
            url="$2"
            echo "=== $label ==="
            start="$(date +%s%3N)"
            code="$(curl -sS --connect-timeout 20 --max-time 90               -o "/tmp/$label.json" -w '%{http_code}'               -H 'Origin: https://get.taphoa.xyz'               -H 'Content-Type: application/json'               -X POST "$API/api/get-price"               --data "$(jq -nc --arg url "$url" '{url:$url,force:true}')")"
            end="$(date +%s%3N)"
            echo "HTTP=$code ms=$((end-start))"
            jq -c '{
              status,engine,link_type,input_url,
              request_id,direct_count,
              products:(.payload.products|length?),
              error,detail
            }' "/tmp/$label.json"

            if [ "$code" = "202" ]; then
              rid="$(jq -r '.request_id' "/tmp/$label.json")"
              for i in $(seq 1 100); do
                sleep 1
                curl -sS                   -H 'Origin: https://get.taphoa.xyz'                   "$API/api/result?id=$rid" > "/tmp/$label-result.json"
                status="$(jq -r '.status // empty' "/tmp/$label-result.json")"
                if [ "$status" = "complete" ] || [ "$status" = "error" ]; then
                  jq -c '{status,engine,error,products:(.payload.products|length?)}' "/tmp/$label-result.json"
                  break
                fi
              done
            fi
          }

          probe product             'https://www.bachhoaxanh.com/hat-nem/bot-ngot-ajinomoto-1kg-cl'

          probe category             'https://www.bachhoaxanh.com/hat-nem'
