name: Probe BHX direct API

on:
  push:
    paths:
      - ".github/workflows/probe-bhx-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
      TOKEN: ${{ secrets.GETLINK_GITHUB_TOKEN }}
    steps:
      - name: Probe BHX direct Worker fetch without D1 writes
        shell: bash
        run: |
          set -euo pipefail

          probe () {
            label="$1"
            url="$2"
            echo "=== $label ==="
            start="$(date +%s%3N)"
            code="$(curl -sS --connect-timeout 20 --max-time 60               -o "/tmp/$label.json" -w '%{http_code}'               -H "Authorization: Bearer $TOKEN"               -H 'Content-Type: application/json'               -X POST "$API/api/probe-bhx-direct"               --data "$(jq -nc --arg url "$url" '{url:$url}')")"
            end="$(date +%s%3N)"
            echo "HTTP=$code ms=$((end-start))"
            cat "/tmp/$label.json" | jq .
          }

          probe product             'https://www.bachhoaxanh.com/hat-nem/bot-ngot-ajinomoto-1kg-cl'

          probe category             'https://www.bachhoaxanh.com/hat-nem'
