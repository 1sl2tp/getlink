name: Probe BHX page size

on:
  push:
    paths:
      - ".github/workflows/probe-bhx-pagesize.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only BHX page-size probe
        shell: bash
        run: |
          set -euo pipefail
          API="$(sed -n 's/^window.GETLINK_API_BASE="\([^"]*\)";/\1/p' config.js)"
          KEY="$(sed -n 's/^window.GETLINK_API_KEY="\([^"]*\)";/\1/p' config.js)"
          START="$(date +%s%3N)"
          curl --fail --silent --show-error             -H "apikey: $KEY"             "$API/api/debug-bhx-page-size?url=https%3A%2F%2Fwww.bachhoaxanh.com%2Fsua-tuoi"             > /tmp/result.json
          END="$(date +%s%3N)"
          echo "wall_ms=$((END-START))"
          jq . /tmp/result.json
