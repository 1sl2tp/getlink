name: Probe BHX regions

on:
  push:
    paths:
      - ".github/workflows/probe-bhx-regions.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region:
          - ap-southeast-1
          - ap-northeast-1
          - ap-northeast-2
          - ap-south-1
          - us-west-1
          - us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Probe BHX from Supabase region
        shell: bash
        run: |
          set -uo pipefail
          API="$(sed -n 's/^window.GETLINK_API_BASE="\([^"]*\)";/\1/p' config.js)"
          KEY="$(sed -n 's/^window.GETLINK_API_KEY="\([^"]*\)";/\1/p' config.js)"
          START="$(date +%s%3N)"
          code="$(curl --silent --show-error             -o /tmp/result.json -w '%{http_code}'             -H "apikey: $KEY"             "$API/api/debug-bhx-region?url=https%3A%2F%2Fwww.bachhoaxanh.com%2Fsua-tuoi&forceFunctionRegion=${{ matrix.region }}" || true)"
          END="$(date +%s%3N)"
          echo "region=${{ matrix.region }} http=$code wall_ms=$((END-START))"
          cat /tmp/result.json | jq . || cat /tmp/result.json
          exit 0
