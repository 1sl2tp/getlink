name: Probe WinMart direct API

on:
  push:
    paths:
      - ".github/workflows/probe-winmart-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public WinMart category API
        shell: bash
        run: |
          set -uo pipefail
          BASE='https://api-crownx.winmart.vn/it/api/web/v3/item/category'
          UA='Mozilla/5.0'
          ORIGIN='https://winmart.vn'
          REF='https://winmart.vn/sua-cac-loai--c08?storeCode=1535'
          candidates=(
            'categoryCode=c08&storeCode=1535&pageNumber=1&pageSize=8'
            'categoryCode=08&storeCode=1535&pageNumber=1&pageSize=8'
            'categoryCode=8&storeCode=1535&pageNumber=1&pageSize=8'
            'cateCode=c08&storeCode=1535&pageNumber=1&pageSize=8'
            'categoryId=c08&storeCode=1535&pageNumber=1&pageSize=8'
            'categoryCode=c08&pageNumber=1&pageSize=8&storeCode=1535'
          )
          n=0
          for q in "${candidates[@]}"; do
            n=$((n+1))
            echo "=== CANDIDATE $n: $q"
            code="$(curl -L -sS --connect-timeout 10 --max-time 20               -A "$UA" -H "Accept: application/json"               -H "Origin: $ORIGIN" -H "Referer: $REF"               -o "/tmp/wm-$n.json" -w '%{http_code}' "$BASE?$q" || true)"
            bytes="$(wc -c < "/tmp/wm-$n.json" 2>/dev/null || echo 0)"
            echo "HTTP=$code bytes=$bytes"
            if jq -e . "/tmp/wm-$n.json" >/dev/null 2>&1; then
              jq -c '{
                keys:(keys|.[0:20]),
                data_keys:((.data // {})|keys|.[0:20]),
                items:((.data.items // [])|length),
                paging:(.paging // null),
                sample:((.data.items // [])[0] // null)
              }' "/tmp/wm-$n.json" | head -c 5000
              echo
            else
              head -c 1200 "/tmp/wm-$n.json" || true
              echo
            fi
          done
