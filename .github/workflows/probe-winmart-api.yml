name: Probe WinMart direct API

on:
  push:
    paths:
      - ".github/workflows/probe-winmart-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test WinMart page size
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api-crownx.winmart.vn/it/api/web/v3/item/category'
          COMMON='storeCode=1535&slug=sua-cac-loai--c08&pageNumber=1&orderByDesc=true&storeGroupCode=1998'
          for size in 8 50 100 200 500; do
            echo "=== pageSize=$size ==="
            START="$(date +%s%3N)"
            curl -L -sS --connect-timeout 10 --max-time 20               -A 'Mozilla/5.0'               -H 'Accept: application/json'               -H 'X-API-MERCHANT: WCM'               -H 'Origin: https://winmart.vn'               -H 'Referer: https://winmart.vn/'               "$BASE?$COMMON&pageSize=$size" -o "/tmp/wm-$size.json"
            END="$(date +%s%3N)"
            jq -c '{
              items:((.data.items // [])|length),
              paging:(.paging // .data.paging // null),
              name:(.data.name // "")
            }' "/tmp/wm-$size.json"
            echo "ms=$((END-START))"
          done
