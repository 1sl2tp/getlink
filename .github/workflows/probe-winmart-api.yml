name: Probe WinMart direct API

on:
  push:
    paths:
      - ".github/workflows/probe-winmart-api.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect WinMart page and API client
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://winmart.vn/sua-cac-loai--c08?storeCode=1535'
          curl -L -sS --connect-timeout 10 --max-time 20             -A 'Mozilla/5.0' "$PAGE" -o /tmp/winmart.html
          echo "HTML bytes=$(wc -c </tmp/winmart.html)"
          echo "=== API/string hits in HTML ==="
          grep -Eo 'https?://[^"''' ]+|/[^"''' ]*item/category[^"''' ]*|api-crownx[^"''' ]*' /tmp/winmart.html             | grep -E 'crownx|item/category' | head -50 || true

          grep -Eo '<script[^>]+src="[^"]+"' /tmp/winmart.html             | sed -E 's/.*src="([^"]+)".*/\1/' > /tmp/scripts.txt || true
          echo "scripts=$(wc -l </tmp/scripts.txt)"
          n=0
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            n=$((n+1))
            case "$src" in
              http*) url="$src" ;;
              //*) url="https:$src" ;;
              /*) url="https://winmart.vn$src" ;;
              *) url="https://winmart.vn/$src" ;;
            esac
            curl -L -sS --connect-timeout 8 --max-time 15 -A 'Mozilla/5.0' "$url" -o "/tmp/js-$n" || continue
            if grep -qE 'item/category|api-crownx|pageNumber|storeCode' "/tmp/js-$n"; then
              echo "=== SCRIPT $n $url ==="
              grep -aoE '.{0,300}(item/category|api-crownx|pageNumber|storeCode).{0,500}' "/tmp/js-$n"                 | head -40 || true
            fi
          done < /tmp/scripts.txt

          echo "=== Guessed API response body ==="
          curl -L -sS --connect-timeout 10 --max-time 20             -A 'Mozilla/5.0'             -H 'Accept: application/json'             -H 'Origin: https://winmart.vn'             -H 'Referer: https://winmart.vn/'             'https://api-crownx.winmart.vn/it/api/web/v3/item/category?categoryCode=c08&storeCode=1535&pageNumber=1&pageSize=8'             | head -c 1200
          echo
