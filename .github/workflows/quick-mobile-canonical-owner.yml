name: Quick mobile canonical owner
on:
  push:
    branches: [fix/mobile-canonical-owner-audit]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-canonical-owner-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply canonical mobile patch
        run: python tools/patch_mobile_canonical_owner.py
      - name: Stamp build
        run: python tools/stamp_static_build.py
      - name: Focused contracts
        run: |
          python -m unittest tests.test_mobile_canonical_owner_audit -v
          python -m unittest tests.test_mobile_standard_document_layout -v
          python -m unittest tests.test_mobile_interaction_owner -v
          python -m unittest tests.test_mobile_iframe_touch_scroll -v
          python -m unittest tests.test_mobile_iframe_tap_fallback -v
          node --check taphoa-mobile-standard.js
          node --check order-management.js
          python tools/stamp_static_build.py --check
      - name: Commit implementation and remove one-time helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taphoa-mobile-standard.js taphoa-mobile-standard.css order-management.js index.html version.json tests/test_mobile_canonical_owner_audit.py
          git rm -f tools/patch_mobile_canonical_owner.py .github/workflows/quick-mobile-canonical-owner.yml
          git commit -m 'fix: canonicalize mobile interaction owner and layout'
          git push origin HEAD:fix/mobile-canonical-owner-audit
