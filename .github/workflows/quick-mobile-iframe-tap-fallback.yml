name: Quick mobile iframe tap fallback
permissions:
  contents: write
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch mobile tap fallback
        run: python tools/quick_mobile_iframe_tap_patch.py
      - name: Stamp and verify
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
          python -m unittest tests.test_mobile_iframe_tap_fallback -v
          python -m unittest tests.test_mobile_interaction_owner -v
          python -m unittest tests.test_mobile_iframe_touch_scroll -v
          python -m unittest tests.test_mobile_standard_document_layout -v
          node --check taphoa-mobile-standard.js
      - name: Commit implementation and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/quick-mobile-iframe-tap-fallback.yml tools/quick_mobile_iframe_tap_patch.py
          git add taphoa-mobile-standard.js tests/test_mobile_iframe_tap_fallback.py index.html version.json
          git commit -m 'fix: promote iOS iframe taps without breaking scroll'
          git push origin HEAD:main
