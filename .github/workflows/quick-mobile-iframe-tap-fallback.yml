name: Quick mobile iframe tap fallback
permissions:
  contents: write
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add touch tap fallback without breaking scroll
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('taphoa-mobile-standard.js')
          s=p.read_text('utf-8')
          anchor='''  function queueAfterAsyncOwner(){\n    queueSync();queueSync(80);queueSync(320);queueSync(1000);\n  }\n\n'''
          block=r'''  const IFRAME_TAP_SELECTOR="#mobileUserWork button,#mobileUserWork [role=\"button\"],#mobileStandardCartSheet button,#orderCustomerPicker button";
  let iframePointerTap=null;
  let iframeSyntheticGuard=null;
  function iframeTapFallbackEnabled(){return isMobile()&&window.parent!==window}
  document.addEventListener("pointerdown",event=>{
    if(!iframeTapFallbackEnabled()||(event.pointerType!=="touch"&&event.pointerType!=="pen"))return;
    const target=event.target.closest?.(IFRAME_TAP_SELECTOR);
    if(!target||target.disabled)return;
    iframePointerTap={pointerId:event.pointerId,target,x:event.clientX,y:event.clientY,at:Date.now()};
  },true);
  document.addEventListener("pointerup",event=>{
    const tap=iframePointerTap;
    iframePointerTap=null;
    if(!tap||tap.pointerId!==event.pointerId||!tap.target.isConnected)return;
    const moved=Math.hypot(event.clientX-tap.x,event.clientY-tap.y);
    if(moved>10||Date.now()-tap.at>800)return;
    event.preventDefault();
    event.stopPropagation();
    iframeSyntheticGuard={target:tap.target,until:performance.now()+700};
    tap.target.click();
  },true);
  document.addEventListener("pointercancel",()=>{iframePointerTap=null;},true);
  document.addEventListener("click",event=>{
    const guard=iframeSyntheticGuard;
    if(!guard||performance.now()>guard.until){iframeSyntheticGuard=null;return;}
    const target=event.target.closest?.(IFRAME_TAP_SELECTOR);
    if(event.isTrusted&&target===guard.target){
      event.preventDefault();
      event.stopImmediatePropagation();
      iframeSyntheticGuard=null;
    }
  },true);

'''
          if 'IFRAME_TAP_SELECTOR' in s:
              raise SystemExit('tap fallback already present')
          if anchor not in s:
              raise SystemExit('tap fallback anchor not found')
          p.write_text(s.replace(anchor,anchor+block,1),'utf-8')

          t=Path('tests/test_mobile_iframe_tap_fallback.py')
          t.write_text(r'''from pathlib import Path
import unittest
ROOT=Path(__file__).resolve().parents[1]
JS=ROOT.joinpath("taphoa-mobile-standard.js").read_text("utf-8")
class MobileIframeTapFallback(unittest.TestCase):
    def test_touch_pointer_is_promoted_to_programmatic_click(self):
        self.assertIn('IFRAME_TAP_SELECTOR', JS)
        self.assertIn('event.pointerType!=="touch"', JS)
        self.assertIn('tap.target.click()', JS)
        self.assertIn('window.parent!==window', JS)
    def test_scroll_gesture_is_not_promoted_to_click(self):
        self.assertIn('Math.hypot(event.clientX-tap.x,event.clientY-tap.y)', JS)
        self.assertIn('moved>10', JS)
        self.assertIn('pointercancel', JS)
    def test_native_followup_click_is_deduplicated(self):
        self.assertIn('event.isTrusted&&target===guard.target', JS)
        self.assertIn('stopImmediatePropagation()', JS)
if __name__=="__main__": unittest.main()
''','utf-8')
          PY
      - name: Stamp and verify
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
          python -m unittest tests.test_mobile_iframe_tap_fallback -v
          python -m unittest tests.test_mobile_interaction_owner -v
          python -m unittest tests.test_mobile_iframe_touch_scroll -v
          python -m unittest tests.test_mobile_standard_document_layout -v
          node --check taphoa-mobile-standard.js
      - name: Commit implementation and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/quick-mobile-iframe-tap-fallback.yml
          git add taphoa-mobile-standard.js tests/test_mobile_iframe_tap_fallback.py index.html version.json
          git commit -m 'fix: promote iOS iframe taps without breaking scroll'
          git push origin HEAD:main
