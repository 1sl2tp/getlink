name: Quick mobile order scroll focus
permissions:
  contents: write
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Red then patch
        run: python tools/hotfix_mobile_order_scroll_focus.py
      - name: Verify hotfix
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
          python -m unittest tests.test_mobile_order_scroll_focus -v
          python -m unittest tests.test_mobile_iframe_tap_fallback -v
          python -m unittest tests.test_mobile_iframe_touch_scroll -v
          python -m unittest tests.test_mobile_interaction_owner -v
          python -m unittest tests.test_mobile_standard_document_layout -v
          node --check order-management.js
          node --check taphoa-mobile-standard.js
      - name: Commit hotfix and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/quick-mobile-order-scroll-focus.yml tools/hotfix_mobile_order_scroll_focus.py
          git add order-management.js taphoa-mobile-standard.css tests/test_mobile_order_scroll_focus.py index.html version.json
          git commit -m 'fix: keep mobile order search focused and list scrollable'
          git push origin HEAD:main
