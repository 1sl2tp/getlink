name: Quick mobile orders scroll and search
permissions:
  contents: write
on:
  push:
    branches:
      - fix/mobile-orders-scroll-search
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch mobile order scroll and search
        run: python tools/patch_mobile_orders_scroll_search.py
      - name: Stamp and verify focused behavior
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
          python -m unittest tests.test_mobile_orders_scroll_search -v
          python -m unittest tests.test_mobile_iframe_tap_fallback -v
          python -m unittest tests.test_mobile_interaction_owner -v
          python -m unittest tests.test_mobile_iframe_touch_scroll -v
          python -m unittest tests.test_mobile_standard_document_layout -v
          node --check order-management.js
          node --check taphoa-mobile-standard.js
      - name: Commit implementation and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/quick-mobile-orders-scroll-search.yml tools/patch_mobile_orders_scroll_search.py
          git add order-management.js taphoa-mobile-standard.css tests/test_mobile_orders_scroll_search.py index.html version.json
          git commit -m 'fix: restore mobile order list scroll and search typing'
          git push origin HEAD:fix/mobile-orders-scroll-search
