name: Repair missing GETLINK images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-missing-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: getlink-missing-image-repair
  cancel-in-progress: true

jobs:
  repair-missing-images:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
      BRIGHTDATA_BROWSER_WSS: ${{ secrets.BRIGHTDATA_BROWSER_WSS }}
      SBR_WS_CDP: ${{ secrets.SBR_WS_CDP }}
      BRIGHTDATA_BROWSER_USERNAME: ${{ secrets.BRIGHTDATA_BROWSER_USERNAME }}
      BRIGHTDATA_BROWSER_PASSWORD: ${{ secrets.BRIGHTDATA_BROWSER_PASSWORD }}
      BRIGHTDATA_COUNTRY: ${{ vars.BRIGHTDATA_COUNTRY || 'vn' }}
      GETLINK_API_BASE: "https://getlink-api.taphoa-4ab8161d.workers.dev"
      GETLINK_CALLBACK_TOKEN: ${{ secrets.GETLINK_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài client
        run: pip install -r scraper/requirements.txt requests

      - name: Lấy danh sách sản phẩm còn thiếu ảnh
        run: |
          set -euo pipefail
          curl --silent --show-error --fail             --retry 10 --retry-delay 3 --retry-all-errors             -H "Authorization: Bearer $GETLINK_CALLBACK_TOKEN"             "$GETLINK_API_BASE/api/image-refresh-targets?mode=missing"             > /tmp/missing-images.json
          jq '{target_count, sample:(.targets[:8])}' /tmp/missing-images.json
          test "$(jq -r '.ok' /tmp/missing-images.json)" = "true"

      - name: Bổ sung ảnh còn thiếu
        run: |
          cat > /tmp/repair_missing_images.py <<'PY'
          import concurrent.futures
          import json
          import os
          import pathlib
          import subprocess
          import time
          import requests

          API=os.environ["GETLINK_API_BASE"].rstrip("/")
          TOKEN=os.environ["GETLINK_CALLBACK_TOKEN"]
          repo=pathlib.Path.cwd()
          work=pathlib.Path("/tmp/getlink-missing-images")
          work.mkdir(parents=True,exist_ok=True)

          with open("/tmp/missing-images.json","r",encoding="utf-8") as fh:
              payload=json.load(fh)
          targets=payload.get("targets") or []

          def repair(item):
              url=str(item.get("url") or "").strip()
              if not url:
                  return {"ok":False,"url":url,"reason":"missing_url","updated":0}
              rid=f"miss-{int(time.time()*1000)}-{abs(hash(url))%10000000}"
              out=work/f"{rid}.json"
              log=work/f"{rid}.log"
              cmd=[
                  "python","scraper/brightdata_bhx.py",
                  "--url",url,
                  "--request-id",rid,
                  "--output",str(out),
              ]
              with log.open("wb") as lf:
                  proc=subprocess.run(cmd,stdout=lf,stderr=subprocess.STDOUT,cwd=repo)
              if proc.returncode!=0 or not out.exists() or out.stat().st_size==0:
                  return {"ok":False,"url":url,"reason":"scrape_failed","updated":0}

              try:
                  data=json.loads(out.read_text(encoding="utf-8"))
              except Exception as exc:
                  return {"ok":False,"url":url,"reason":f"bad_json:{exc}","updated":0}
              data["kind"]="product"

              try:
                  resp=requests.post(
                      API+"/api/image-refresh",
                      headers={
                          "Authorization":"Bearer "+TOKEN,
                          "Content-Type":"application/json",
                      },
                      json=data,
                      timeout=60,
                  )
                  if not resp.ok:
                      return {"ok":False,"url":url,"reason":f"http_{resp.status_code}","updated":0}
                  saved=resp.json()
                  return {
                      "ok":True,
                      "url":url,
                      "updated":int(saved.get("updated") or 0),
                      "missing":int(saved.get("missing") or 0),
                  }
              except Exception as exc:
                  return {"ok":False,"url":url,"reason":f"post_failed:{exc}","updated":0}

          total=len(targets)
          print(f"Thiếu ảnh trước sửa: {total}",flush=True)
          updated=0
          failed=[]

          # 3 luồng: nhanh hơn nhưng vẫn giữ tải Bright Data vừa phải.
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              future_map={ex.submit(repair,item):item for item in targets}
              done=0
              for fut in concurrent.futures.as_completed(future_map):
                  done+=1
                  try:
                      result=fut.result()
                  except Exception as exc:
                      result={"ok":False,"url":str(future_map[fut].get("url") or ""),"reason":str(exc),"updated":0}
                  updated+=int(result.get("updated") or 0)
                  if not result.get("ok") or not result.get("updated"):
                      failed.append(result)
                  print(f"[{done}/{total}] updated={updated} failed={len(failed)}",flush=True)

          pathlib.Path("/tmp/missing-repair-summary.json").write_text(
              json.dumps({
                  "target_count":total,
                  "updated":updated,
                  "failed_count":len(failed),
                  "failed":failed,
              },ensure_ascii=False,indent=2),
              encoding="utf-8",
          )
          PY

          python /tmp/repair_missing_images.py
          cat /tmp/missing-repair-summary.json

      - name: Kiểm tra lại ảnh còn thiếu
        run: |
          set -euo pipefail
          curl --silent --show-error --fail             --retry 10 --retry-delay 3 --retry-all-errors             -H "Authorization: Bearer $GETLINK_CALLBACK_TOKEN"             "$GETLINK_API_BASE/api/image-refresh-targets?mode=missing"             > /tmp/missing-images-after.json

          BEFORE="$(jq '.target_count // 0' /tmp/missing-images.json)"
          AFTER="$(jq '.target_count // 0' /tmp/missing-images-after.json)"
          UPDATED="$(jq '.updated // 0' /tmp/missing-repair-summary.json)"

          echo "Thiếu trước: $BEFORE"
          echo "Đã bổ sung: $UPDATED"
          echo "Còn thiếu: $AFTER"

          echo "MISSING_IMAGES_BEFORE=$BEFORE" >> "$GITHUB_ENV"
          echo "MISSING_IMAGES_UPDATED=$UPDATED" >> "$GITHUB_ENV"
          echo "MISSING_IMAGES_AFTER=$AFTER" >> "$GITHUB_ENV"

      - name: Tổng kết
        if: always()
        run: |
          echo "Thiếu ảnh trước: ${MISSING_IMAGES_BEFORE:-?}"
          echo "Đã bổ sung: ${MISSING_IMAGES_UPDATED:-?}"
          echo "Còn thiếu: ${MISSING_IMAGES_AFTER:-?}"
