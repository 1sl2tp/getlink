name: Restamp mobile touch fix
permissions:
  contents: write
on:
  push:
    branches:
      - main
jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/stamp_static_build.py
      - run: python tools/stamp_static_build.py --check
      - run: python -m unittest tests.test_mobile_iframe_touch_scroll -v
      - run: python -m unittest tests.test_mobile_standard_document_layout -v
      - run: node --check taphoa-mobile-standard.js
      - name: Commit stamp and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/restamp-mobile-touch-fix.yml
          git add index.html version.json
          git commit -m 'chore: stamp mobile iframe touch fix'
          git push origin HEAD:main
