name: Lấy giá GO Hà Nam

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Dán link nhóm GO!"
        required: true
        type: string
      request_id:
        description: "Mã yêu cầu từ GETLINK Worker"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: getlink-go-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  get-price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
      BRIGHTDATA_BROWSER_WSS: ${{ secrets.BRIGHTDATA_BROWSER_WSS }}
      SBR_WS_CDP: ${{ secrets.SBR_WS_CDP }}
      BRIGHTDATA_BROWSER_USERNAME: ${{ secrets.BRIGHTDATA_BROWSER_USERNAME }}
      BRIGHTDATA_BROWSER_PASSWORD: ${{ secrets.BRIGHTDATA_BROWSER_PASSWORD }}
      BRIGHTDATA_COUNTRY: ${{ vars.BRIGHTDATA_COUNTRY || 'vn' }}
      INPUT_URL: ${{ inputs.url }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      GETLINK_API_BASE: "https://getlink-api.taphoa-4ab8161d.workers.dev"
      GETLINK_CALLBACK_TOKEN: ${{ secrets.GETLINK_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Báo runner đã bắt đầu
        run: |
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GETLINK_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"request_id\":\"$INPUT_REQUEST_ID\",\"stage\":\"runner\"}" \
            "$GETLINK_API_BASE/api/progress" >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Playwright client
        run: pip install -r scraper/requirements.txt

      - name: Báo đang mở Bright Data / GO Hà Nam
        run: |
          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GETLINK_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"request_id\":\"$INPUT_REQUEST_ID\",\"stage\":\"brightdata\"}" \
            "$GETLINK_API_BASE/api/progress" >/dev/null

      - name: Mở GO Hà Nam và lấy danh sách sản phẩm
        id: scrape
        continue-on-error: true
        run: |
          set +e
          python scraper/brightdata_go.py \
            --url "$INPUT_URL" \
            --request-id "$INPUT_REQUEST_ID" \
            --output "data/jobs/$INPUT_REQUEST_ID.json" \
            2>&1 | tee /tmp/getlink-go.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Báo đang lưu kết quả
        if: always()
        continue-on-error: true
        run: |
          curl --silent --show-error \
            -H "Authorization: Bearer $GETLINK_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"request_id\":\"$INPUT_REQUEST_ID\",\"stage\":\"saving\"}" \
            "$GETLINK_API_BASE/api/progress" >/dev/null || true

      - name: Đảm bảo có file kết quả
        if: always()
        run: |
          if [ -n "$INPUT_REQUEST_ID" ] && [ ! -s "data/jobs/$INPUT_REQUEST_ID.json" ]; then
            mkdir -p data/jobs
            DETAIL="$(tail -50 /tmp/getlink-go.log 2>/dev/null | tr '\n' ' ' | cut -c1-1800)"
            jq -n \
              --arg status "error" \
              --arg error "go_runner_failed" \
              --arg detail "$DETAIL" \
              --arg request_id "$INPUT_REQUEST_ID" \
              '{status:$status,error:$error,detail:$detail,request_id:$request_id}' \
              > "data/jobs/$INPUT_REQUEST_ID.json"
          fi

      - name: Gửi response về GETLINK Worker
        if: always()
        run: |
          set -euo pipefail
          test -n "$INPUT_REQUEST_ID"
          test -s "data/jobs/$INPUT_REQUEST_ID.json"
          test -n "$GETLINK_CALLBACK_TOKEN"

          HTTP_CODE="$(curl --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/getlink-callback.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer $GETLINK_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"data/jobs/$INPUT_REQUEST_ID.json" \
            "$GETLINK_API_BASE/api/complete")"

          echo "Callback HTTP $HTTP_CODE"
          cat /tmp/getlink-callback.json | jq . || cat /tmp/getlink-callback.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300

      - name: Báo trạng thái
        if: steps.scrape.outputs.code != '0'
        run: |
          echo "GO Hà Nam chưa trả dữ liệu hợp lệ; xem log scraper."
          exit 1
