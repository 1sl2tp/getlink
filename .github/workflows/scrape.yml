name: Lấy giá BHX

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Dán link Bách Hóa XANH (nhóm hoặc chi tiết)"
        required: true
        type: string
      request_id:
        description: "Mã yêu cầu từ GETLINK Worker"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: getlink-bhx
  cancel-in-progress: false

jobs:
  get-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài Python + Chromium
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Lấy giá
        id: scrape
        continue-on-error: true
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set +e
          python scraper/scraper.py --url "$INPUT_URL" --request-id "$INPUT_REQUEST_ID" --max-products 20 2>&1 | tee /tmp/getlink-scrape.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -ne 0 ] && [ -n "$INPUT_REQUEST_ID" ]; then
            mkdir -p data/jobs
            DETAIL="$(tail -40 /tmp/getlink-scrape.log | tr '\n' ' ' | cut -c1-1200)"
            jq -n               --arg status "error"               --arg error "Không lấy được dữ liệu từ Bách Hóa XANH"               --arg detail "$DETAIL"               --arg request_id "$INPUT_REQUEST_ID"               '{status:$status,error:$error,detail:$detail,request_id:$request_id}'               > "data/jobs/$INPUT_REQUEST_ID.json"
          fi
          exit 0

      - name: Lưu kết quả về GitHub
        run: |
          git config user.name "getlink-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json data/products.csv data/latest.json data/jobs
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          git commit -m "data: cập nhật giá BHX"
          git push origin HEAD:main

      - name: Báo trạng thái scrape
        if: steps.scrape.outputs.code != '0'
        run: |
          echo "BHX scrape failed; error result was saved for GETLINK UI."
          exit 1
