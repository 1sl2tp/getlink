name: Lấy giá BHX

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Dán link Bách Hóa XANH (nhóm hoặc chi tiết)"
        required: true
        type: string
      request_id:
        description: "Mã yêu cầu từ GETLINK Worker"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: getlink-bhx-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  get-price:
    runs-on: ubuntu-latest
    env:
      BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
      BRIGHTDATA_BROWSER_WSS: ${{ secrets.BRIGHTDATA_BROWSER_WSS }}
      SBR_WS_CDP: ${{ secrets.SBR_WS_CDP }}
      BRIGHTDATA_BROWSER_USERNAME: ${{ secrets.BRIGHTDATA_BROWSER_USERNAME }}
      BRIGHTDATA_BROWSER_PASSWORD: ${{ secrets.BRIGHTDATA_BROWSER_PASSWORD }}
      BRIGHTDATA_COUNTRY: ${{ vars.BRIGHTDATA_COUNTRY || 'vn' }}
      INPUT_URL: ${{ inputs.url }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      GETLINK_API_BASE: "https://getlink-api.taphoa-4ab8161d.workers.dev"
      GETLINK_CALLBACK_TOKEN: ${{ secrets.GETLINK_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Playwright client
        run: pip install -r scraper/requirements.txt

      - name: Mở link qua Bright Data và bắt API BHX
        id: scrape
        continue-on-error: true
        run: |
          set +e
          python scraper/brightdata_bhx.py \
            --url "$INPUT_URL" \
            --request-id "$INPUT_REQUEST_ID" \
            --output "data/jobs/$INPUT_REQUEST_ID.json" \
            2>&1 | tee /tmp/getlink-brightdata.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Đảm bảo có kết quả lỗi nếu runner dừng bất thường
        if: always()
        run: |
          if [ -n "$INPUT_REQUEST_ID" ] && [ ! -s "data/jobs/$INPUT_REQUEST_ID.json" ]; then
            mkdir -p data/jobs
            DETAIL="$(tail -50 /tmp/getlink-brightdata.log 2>/dev/null | tr '\n' ' ' | cut -c1-1800)"
            jq -n \
              --arg status "error" \
              --arg error "brightdata_runner_failed" \
              --arg detail "$DETAIL" \
              --arg request_id "$INPUT_REQUEST_ID" \
              '{status:$status,error:$error,detail:$detail,request_id:$request_id}' \
              > "data/jobs/$INPUT_REQUEST_ID.json"
          fi

      - name: Gửi response thẳng về GETLINK Worker
        if: always()
        run: |
          set -euo pipefail
          test -n "$INPUT_REQUEST_ID"
          test -s "data/jobs/$INPUT_REQUEST_ID.json"
          test -n "$GETLINK_CALLBACK_TOKEN"

          HTTP_CODE="$(curl --silent --show-error             --retry 5 --retry-delay 2 --retry-all-errors             -o /tmp/getlink-callback.json             -w '%{http_code}'             -H "Authorization: Bearer $GETLINK_CALLBACK_TOKEN"             -H "Content-Type: application/json"             --data-binary @"data/jobs/$INPUT_REQUEST_ID.json"             "$GETLINK_API_BASE/api/complete")"

          echo "Callback HTTP $HTTP_CODE"
          cat /tmp/getlink-callback.json | jq . || cat /tmp/getlink-callback.json

          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300

      - name: Báo trạng thái
        if: steps.scrape.outputs.code != '0'
        run: |
          echo "Bright Data/BHX chưa trả API hợp lệ; file lỗi đã được lưu cho GETLINK UI."
          exit 1
