name: Smoke BHX Category

on:
  push:
    paths:
      - "scraper/brightdata_bhx.py"
      - ".github/workflows/smoke-bhx.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BRIGHTDATA_BROWSER_WS: ${{ secrets.BRIGHTDATA_BROWSER_WS }}
      BRIGHTDATA_BROWSER_WSS: ${{ secrets.BRIGHTDATA_BROWSER_WSS }}
      SBR_WS_CDP: ${{ secrets.SBR_WS_CDP }}
      BRIGHTDATA_BROWSER_USERNAME: ${{ secrets.BRIGHTDATA_BROWSER_USERNAME }}
      BRIGHTDATA_BROWSER_PASSWORD: ${{ secrets.BRIGHTDATA_BROWSER_PASSWORD }}
      BRIGHTDATA_COUNTRY: ${{ vars.BRIGHTDATA_COUNTRY || 'vn' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Playwright client
        run: pip install -r scraper/requirements.txt

      - name: BHX Sữa tươi phải lấy đủ 113 sản phẩm
        run: |
          set -euo pipefail
          python scraper/brightdata_bhx.py \
            --url "https://www.bachhoaxanh.com/sua-tuoi" \
            --request-id "smoke-bhx-api-first" \
            --output "/tmp/bhx.json"

          jq '{
            status,
            kind,
            response_url,
            products:(.bhx_response.data.products|length)
          }' /tmp/bhx.json

          test "$(jq -r '.status' /tmp/bhx.json)" = "complete"
          test "$(jq -r '.kind' /tmp/bhx.json)" = "category"
          COUNT="$(jq -r '.bhx_response.data.products|length' /tmp/bhx.json)"
          test "$COUNT" -eq 113
