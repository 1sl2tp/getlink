name: Smoke GETLINK

on:
  push:
    paths:
      - ".github/workflows/smoke-get.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test GETLINK sample
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          SAMPLE: "https://www.bachhoaxanh.com/dau-an/thung-6-can-dau-dau-nanh-nguyen-chat-simply-2-lit"
        run: |
          set -euo pipefail
          echo "Health:"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$API/health" | jq .

          echo "Get sample:"
          HTTP_CODE="$(curl --silent --show-error             --connect-timeout 20 --max-time 70             -o /tmp/getlink-response.json             -w '%{http_code}'             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/get-price"             --data "$(jq -nc --arg url "$SAMPLE" '{url:$url}')")"

          jq '{request_id,status,link_type,registry_count,error,detail}' /tmp/getlink-response.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
          REQUEST_ID="$(jq -r '.request_id // empty' /tmp/getlink-response.json)"
          test -n "$REQUEST_ID"

          echo "Result:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             "$API/api/result?id=$REQUEST_ID"             | jq '{status,registry_count,input_type:.payload.input_type,name:(.payload.product.name // .payload.category_name),price:(.payload.product.price.current // null),children:(.payload.products|length)}'
