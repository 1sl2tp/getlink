name: Smoke GETLINK
# callback smoke
# local-snapshot smoke

on:
  push:
    paths:
      - ".github/workflows/smoke-get.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test GETLINK sample
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          SAMPLE: "https://www.bachhoaxanh.com/dau-an/thung-12-chai-dau-thuc-vat-good-meall-1-lit"
        run: |
          set -euo pipefail
          echo "Health:"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$API/health" | jq .

          echo "Get sample:"
          HTTP_CODE="$(curl --silent --show-error \
            --connect-timeout 20 --max-time 70 \
            -o /tmp/getlink-response.json \
            -w '%{http_code}' \
            -H 'Origin: https://get.taphoa.xyz' \
            -H 'Content-Type: application/json' \
            -X POST "$API/api/get-price" \
            --data "$(jq -nc --arg url "$SAMPLE" '{url:$url}')")"

          jq '{request_id,status,link_type,registry_count,error,detail,engine}' /tmp/getlink-response.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
          REQUEST_ID="$(jq -r '.request_id // empty' /tmp/getlink-response.json)"
          test -n "$REQUEST_ID"

          echo "Wait result:"
          for i in $(seq 1 48); do
            sleep 5
            curl --fail --silent --show-error \
              -H 'Origin: https://get.taphoa.xyz' \
              "$API/api/result?id=$REQUEST_ID" > /tmp/getlink-result.json
            STATUS="$(jq -r '.status // empty' /tmp/getlink-result.json)"
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" = "complete" ]; then
              jq '{status,registry_count,input_type:.payload.input_type,name:(.payload.product.name // .payload.category_name),price:(.payload.product.price.current // null),children:(.payload.products|length),variants:(.payload.variants|length),variant_prices:[.payload.variants[].price.current]}' /tmp/getlink-result.json
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              jq . /tmp/getlink-result.json
              exit 1
            fi
          done

          echo "Timeout waiting for complete result"
          jq . /tmp/getlink-result.json || true
          exit 1

      - name: Verify D1 24h cache
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          SAMPLE: "https://www.bachhoaxanh.com/dau-an/thung-12-chai-dau-thuc-vat-good-meall-1-lit"
        run: |
          set -euo pipefail
          echo "Cache hit:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/get-price"             --data "$(jq -nc --arg url "$SAMPLE" '{url:$url}')"             > /tmp/getlink-cache.json
          jq '{status,engine,cache_hit,cache_age_seconds,price:(.payload.product.price.current // null),variants:(.payload.variants|length)}' /tmp/getlink-cache.json
          test "$(jq -r '.status' /tmp/getlink-cache.json)" = "complete"
          test "$(jq -r '.engine' /tmp/getlink-cache.json)" = "d1-cache"
          test "$(jq -r '.cache_hit' /tmp/getlink-cache.json)" = "true"


      - name: Verify catalog library
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
        run: |
          set -euo pipefail

          echo "Groups:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             "$API/api/library?view=groups" > /tmp/library-groups.json
          jq '{groups:[.groups[]|{name,product_count,url}]}' /tmp/library-groups.json
          test "$(jq '.groups|length' /tmp/library-groups.json)" -ge 1

          PARENT="$(jq -r '.groups[0].url' /tmp/library-groups.json)"
          echo "Products for $PARENT:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             "$API/api/library?view=products&parent=$(python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["PARENT"]))' 2>/dev/null || true)"             > /tmp/library-products.json || true

          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             --get             --data-urlencode "view=products"             --data-urlencode "parent=$PARENT"             "$API/api/library" > /tmp/library-products.json

          jq '{count:(.products|length),sample:(.products[0]|{name,current_price,promotion_price,unit_price,canonical_url})}' /tmp/library-products.json
          test "$(jq '.products|length' /tmp/library-products.json)" -ge 1

          ITEM="$(jq -r '.products[0].canonical_url' /tmp/library-products.json)"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             --get             --data-urlencode "view=item"             --data-urlencode "url=$ITEM"             "$API/api/library" > /tmp/library-item.json

          jq '{status,source,name:.payload.product.name,variants:(.payload.variants|length)}' /tmp/library-item.json
          test "$(jq -r '.status' /tmp/library-item.json)" = "complete"


      - name: Verify parent child sync
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          PARENT: "https://www.bachhoaxanh.com/dau-an"
        run: |
          set -euo pipefail

          echo "Queue/read parent:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/get-price"             --data "$(jq -nc --arg url "$PARENT" '{url:$url}')"             > /tmp/parent-create.json

          jq '{request_id,status,engine,cache_hit,link_type}' /tmp/parent-create.json
          RID="$(jq -r '.request_id // empty' /tmp/parent-create.json)"
          STATUS="$(jq -r '.status // empty' /tmp/parent-create.json)"
          test -n "$RID"

          if [ "$STATUS" != "complete" ]; then
            for i in $(seq 1 48); do
              sleep 5
              curl --fail --silent --show-error                 -H 'Origin: https://get.taphoa.xyz'                 "$API/api/result?id=$RID" > /tmp/parent-result.json
              STATUS="$(jq -r '.status // empty' /tmp/parent-result.json)"
              echo "parent poll=$i status=$STATUS"
              [ "$STATUS" = "complete" ] && break
              if [ "$STATUS" = "error" ]; then
                jq . /tmp/parent-result.json
                exit 1
              fi
            done
          else
            cp /tmp/parent-create.json /tmp/parent-result.json
          fi

          test "$STATUS" = "complete"
          jq '{name:.payload.category_name,child_count:(.payload.products|length),discovered:(.payload.discovered_links|length)}' /tmp/parent-result.json
          test "$(jq '.payload.products|length' /tmp/parent-result.json)" -ge 2

          PARENT_CANONICAL="https://bachhoaxanh.com/dau-an"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             --get             --data-urlencode "view=products"             --data-urlencode "parent=$PARENT_CANONICAL"             --data-urlencode "limit=500"             "$API/api/library" > /tmp/parent-products.json

          jq '{count:(.products|length),sample:(.products[0]|{name,canonical_url,parent_url,current_price})}' /tmp/parent-products.json
          test "$(jq '.products|length' /tmp/parent-products.json)" -ge 2
          test "$(jq -r '.products[0].parent_url' /tmp/parent-products.json)" = "$PARENT_CANONICAL"

      - name: Verify child updates source parent
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
        run: |
          set -euo pipefail
          CHILD="$(jq -r '.products[0].canonical_url' /tmp/parent-products.json)"
          test -n "$CHILD"

          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/get-price"             --data "$(jq -nc --arg url "$CHILD" '{url:$url}')"             > /tmp/child-create.json

          RID="$(jq -r '.request_id // empty' /tmp/child-create.json)"
          STATUS="$(jq -r '.status // empty' /tmp/child-create.json)"
          test -n "$RID"

          if [ "$STATUS" != "complete" ]; then
            for i in $(seq 1 48); do
              sleep 5
              curl --fail --silent --show-error                 -H 'Origin: https://get.taphoa.xyz'                 "$API/api/result?id=$RID" > /tmp/child-result.json
              STATUS="$(jq -r '.status // empty' /tmp/child-result.json)"
              echo "child poll=$i status=$STATUS"
              [ "$STATUS" = "complete" ] && break
              if [ "$STATUS" = "error" ]; then
                jq . /tmp/child-result.json
                exit 1
              fi
            done
          else
            cp /tmp/child-create.json /tmp/child-result.json
          fi

          test "$STATUS" = "complete"
          jq '{name:.payload.product.name,parent_url:.payload.parent_url,source_parent:.payload.source_parent,variants:(.payload.variants|length)}' /tmp/child-result.json
          test "$(jq -r '.payload.parent_url' /tmp/child-result.json)" = "https://bachhoaxanh.com/dau-an"

      - name: Verify watch hidden retention
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          TOKEN: ${{ secrets.GETLINK_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHILD="$(jq -r '.products[0].canonical_url' /tmp/parent-products.json)"

          echo "Mark watch:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/preference"             --data "$(jq -nc --arg url "$CHILD" '{url:$url,state:"watch",refresh_hours:6}')"             > /tmp/pref-watch.json
          jq . /tmp/pref-watch.json
          test "$(jq -r '.preference.state' /tmp/pref-watch.json)" = "watch"
          test "$(jq -r '.preference.auto_refresh' /tmp/pref-watch.json)" = "1"

          echo "Authenticated due planner:"
          test -n "$TOKEN"
          curl --fail --silent --show-error             -H "Authorization: Bearer $TOKEN"             -H 'Content-Type: application/json'             -X POST "$API/api/refresh-due"             --data '{"limit":1}' > /tmp/due.json
          jq '{ok,queued_count,error_count}' /tmp/due.json
          test "$(jq -r '.ok' /tmp/due.json)" = "true"

          echo "Hide without deleting:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/preference"             --data "$(jq -nc --arg url "$CHILD" '{url:$url,state:"hidden"}')"             > /tmp/pref-hidden.json
          test "$(jq -r '.preference.state' /tmp/pref-hidden.json)" = "hidden"

          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             "$API/api/library?view=search&limit=2000" > /tmp/default-library.json
          test "$(jq --arg u "$CHILD" '[.products[]|select(.canonical_url==$u)]|length' /tmp/default-library.json)" = "0"

          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             "$API/api/library?view=search&limit=2000&include_hidden=1" > /tmp/all-library.json
          test "$(jq --arg u "$CHILD" '[.products[]|select(.canonical_url==$u)]|length' /tmp/all-library.json)" = "1"

          echo "Restore normal after smoke:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/preference"             --data "$(jq -nc --arg url "$CHILD" '{url:$url,state:"normal"}')"             >/dev/null
