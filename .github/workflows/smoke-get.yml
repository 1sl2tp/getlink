name: Smoke GETLINK
# callback smoke
# local-snapshot smoke

on:
  push:
    paths:
      - ".github/workflows/smoke-get.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test GETLINK sample
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          SAMPLE: "https://www.bachhoaxanh.com/dau-an/thung-12-chai-dau-thuc-vat-good-meall-1-lit"
        run: |
          set -euo pipefail
          echo "Health:"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "$API/health" | jq .

          echo "Get sample:"
          HTTP_CODE="$(curl --silent --show-error \
            --connect-timeout 20 --max-time 70 \
            -o /tmp/getlink-response.json \
            -w '%{http_code}' \
            -H 'Origin: https://get.taphoa.xyz' \
            -H 'Content-Type: application/json' \
            -X POST "$API/api/get-price" \
            --data "$(jq -nc --arg url "$SAMPLE" '{url:$url}')")"

          jq '{request_id,status,link_type,registry_count,error,detail,engine}' /tmp/getlink-response.json
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
          REQUEST_ID="$(jq -r '.request_id // empty' /tmp/getlink-response.json)"
          test -n "$REQUEST_ID"

          echo "Wait result:"
          for i in $(seq 1 48); do
            sleep 5
            curl --fail --silent --show-error \
              -H 'Origin: https://get.taphoa.xyz' \
              "$API/api/result?id=$REQUEST_ID" > /tmp/getlink-result.json
            STATUS="$(jq -r '.status // empty' /tmp/getlink-result.json)"
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" = "complete" ]; then
              jq '{status,registry_count,input_type:.payload.input_type,name:(.payload.product.name // .payload.category_name),price:(.payload.product.price.current // null),children:(.payload.products|length),variants:(.payload.variants|length),variant_prices:[.payload.variants[].price.current]}' /tmp/getlink-result.json
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              jq . /tmp/getlink-result.json
              exit 1
            fi
          done

          echo "Timeout waiting for complete result"
          jq . /tmp/getlink-result.json || true
          exit 1

      - name: Verify D1 24h cache
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          SAMPLE: "https://www.bachhoaxanh.com/dau-an/thung-12-chai-dau-thuc-vat-good-meall-1-lit"
        run: |
          set -euo pipefail
          echo "Cache hit:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/get-price"             --data "$(jq -nc --arg url "$SAMPLE" '{url:$url}')"             > /tmp/getlink-cache.json
          jq '{status,engine,cache_hit,cache_age_seconds,price:(.payload.product.price.current // null),variants:(.payload.variants|length)}' /tmp/getlink-cache.json
          test "$(jq -r '.status' /tmp/getlink-cache.json)" = "complete"
          test "$(jq -r '.engine' /tmp/getlink-cache.json)" = "d1-cache"
          test "$(jq -r '.cache_hit' /tmp/getlink-cache.json)" = "true"


      - name: Verify catalog library
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
        run: |
          set -euo pipefail

          echo "Groups:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             "$API/api/library?view=groups" > /tmp/library-groups.json
          jq '{groups:[.groups[]|{name,product_count,url}]}' /tmp/library-groups.json
          test "$(jq '.groups|length' /tmp/library-groups.json)" -ge 1

          PARENT="$(jq -r '.groups[0].url' /tmp/library-groups.json)"
          echo "Products for $PARENT:"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             "$API/api/library?view=products&parent=$(python -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["PARENT"]))' 2>/dev/null || true)"             > /tmp/library-products.json || true

          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             --get             --data-urlencode "view=products"             --data-urlencode "parent=$PARENT"             "$API/api/library" > /tmp/library-products.json

          jq '{count:(.products|length),sample:(.products[0]|{name,current_price,promotion_price,unit_price,canonical_url})}' /tmp/library-products.json
          test "$(jq '.products|length' /tmp/library-products.json)" -ge 1

          ITEM="$(jq -r '.products[0].canonical_url' /tmp/library-products.json)"
          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             --get             --data-urlencode "view=item"             --data-urlencode "url=$ITEM"             "$API/api/library" > /tmp/library-item.json

          jq '{status,source,name:.payload.product.name,variants:(.payload.variants|length)}' /tmp/library-item.json
          test "$(jq -r '.status' /tmp/library-item.json)" = "complete"
