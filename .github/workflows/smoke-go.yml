name: Smoke GO Hà Nam

on:
  push:
    paths:
      - ".github/workflows/smoke-go.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Chờ Worker/Pages nhận nguồn GO
        run: sleep 45

      - name: GET nguồn 3 GO Hà Nam
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          SAMPLE: "https://sieuthi-go.vn/categories/sua-cac-loai-i.81"
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API/health" | jq .

          HTTP_CODE="$(curl --silent --show-error \
            --connect-timeout 20 --max-time 70 \
            -o /tmp/go-create.json \
            -w '%{http_code}' \
            -H 'Origin: https://get.taphoa.xyz' \
            -H 'Content-Type: application/json' \
            -X POST "$API/api/get-price" \
            --data "$(jq -nc --arg url "$SAMPLE" '{url:$url,force:true}')")"

          cat /tmp/go-create.json | jq .
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
          RID="$(jq -r '.request_id // empty' /tmp/go-create.json)"
          test -n "$RID"

          for i in $(seq 1 120); do
            sleep 5
            curl --fail --silent --show-error \
              -H 'Origin: https://get.taphoa.xyz' \
              "$API/api/result?id=$RID" > /tmp/go-result.json
            STATUS="$(jq -r '.status // empty' /tmp/go-result.json)"
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" = "complete" ]; then
              jq '{
                status,
                source:(.payload.source.name // ""),
                store:(.payload.store.name // ""),
                category:(.payload.category_name // ""),
                products:(.payload.products|length),
                mapped:(.payload.mapped_to_bhx // 0),
                unmapped:(.payload.unmapped_to_bhx // 0),
                sample:(.payload.products[0] // {})
              }' /tmp/go-result.json
              test "$(jq -r '.payload.source.name // empty' /tmp/go-result.json)" = "GO!"
              test "$(jq -r '.payload.store.name // empty' /tmp/go-result.json)" = "GO! Hà Nam"
              test "$(jq '.payload.products|length' /tmp/go-result.json)" -ge 1
              break
            fi
            if [ "$STATUS" = "error" ]; then
              cat /tmp/go-result.json | jq .
              exit 1
            fi
            if [ "$i" = "120" ]; then
              cat /tmp/go-result.json | jq .
              exit 1
            fi
          done

          curl --fail --silent --show-error \
            -H 'Origin: https://get.taphoa.xyz' \
            "$API/api/library?view=search&limit=2000&include_hidden=1" \
            > /tmp/library.json

          jq '{
            go_count:([.products[]|select(.source=="GO!")]|length),
            go_image_count:([.products[]|select(.source=="GO!" and (.image // "") != "")]|length),
            go_pack_count:([.products[]|select(.source=="GO!" and ((.pack_label_1 // "") != "" or (.pack_label_2 // "") != "" or (.pack_label_3 // "") != ""))]|length),
            mapped_groups:([.products[]|select(.source=="GO!" and .parent_url!=null)|.group_name]|unique),
            carton_sample:([.products[]|select(.source=="GO!" and .pack_label_1=="Thùng")][0] // {}),
            retail_sample:([.products[]|select(.source=="GO!" and (.pack_label_3 // "") != "" and .pack_label_1!="Thùng")][0] // {})
          }' /tmp/library.json

          GO_COUNT="$(jq '[.products[]|select(.source=="GO!")]|length' /tmp/library.json)"
          GO_PACK="$(jq '[.products[]|select(.source=="GO!" and ((.pack_label_1 // "") != "" or (.pack_label_2 // "") != "" or (.pack_label_3 // "") != ""))]|length' /tmp/library.json)"
          test "$GO_COUNT" -ge 1
          test "$GO_PACK" -ge 1
