name: Smoke Supabase GETLINK

on:
  push:
    paths:
      - "config.js"
      - "supabase/functions/getlink-api/**"
      - "supabase/migrations/**"
      - ".github/workflows/smoke-supabase.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Supabase smoke
        shell: bash
        run: |
          set -euo pipefail
          API="$(sed -n 's/^window.GETLINK_API_BASE="\([^"]*\)";/\1/p' config.js)"
          KEY="$(sed -n 's/^window.GETLINK_API_KEY="\([^"]*\)";/\1/p' config.js)"
          test -n "$API"
          test -n "$KEY"

          curl --fail --silent --show-error             -H "apikey: $KEY"             "$API/health" > /tmp/health.json
          jq . /tmp/health.json
          test "$(jq -r '.ok' /tmp/health.json)" = "true"
          test "$(jq -r '.mode' /tmp/health.json)" = "supabase-only"
          jq -e '.stale_jobs_cleaned | type=="number"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error             -H "apikey: $KEY"             "$API/api/library?view=search&limit=10&include_hidden=1"             > /tmp/library.json
          jq '{products:(.products|length)}' /tmp/library.json
          jq -e '.products | type=="array"' /tmp/library.json >/dev/null

          curl --fail --silent --show-error             -H "apikey: $KEY"             "$API/api/library?view=source-manager"             > /tmp/source-manager.json
          jq '{brands:(.brands|length),groups:(.groups|length),products:.products}' /tmp/source-manager.json
          jq -e '.brands | type=="array"' /tmp/source-manager.json >/dev/null
          jq -e '.groups | type=="array"' /tmp/source-manager.json >/dev/null
          jq -e '.products.all | type=="number"' /tmp/source-manager.json >/dev/null
          jq -e '.products.wm | type=="number"' /tmp/source-manager.json >/dev/null
          jq -e '.products.bhx | type=="number"' /tmp/source-manager.json >/dev/null
          jq -e '.products.go | type=="number"' /tmp/source-manager.json >/dev/null
