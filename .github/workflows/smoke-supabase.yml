name: Smoke Supabase GETLINK

permissions:
  contents: read

concurrency:
  group: smoke-supabase-getlink
  cancel-in-progress: true

on:
  push:
    paths:
      - "config.js"
      - "supabase/functions/getlink-api/**"
      - "supabase/functions/getlink-order-agent/**"
      - "supabase/migrations/**"
      - ".github/workflows/smoke-supabase.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Supabase smoke
        shell: bash
        run: |
          set -euo pipefail
          API="$(sed -n 's/^window.GETLINK_API_BASE="\([^"]*\)";/\1/p' config.js)"
          KEY="$(sed -n 's/^window.GETLINK_API_KEY="\([^"]*\)";/\1/p' config.js)"
          test -n "$API"
          test -n "$KEY"

          curl --fail --silent --show-error \
            -H "apikey: $KEY" \
            "$API/health" > /tmp/health.json
          jq . /tmp/health.json
          test "$(jq -r '.ok' /tmp/health.json)" = "true"
          test "$(jq -r '.mode' /tmp/health.json)" = "supabase-only"
          jq -e '.stale_jobs_cleaned | type=="number"' /tmp/health.json >/dev/null

          AGENT="${API%/getlink-api}/getlink-order-agent/health"
          curl --fail --silent --show-error "$AGENT" > /tmp/order-agent-health.json
          jq . /tmp/order-agent-health.json
          test "$(jq -r '.ok' /tmp/order-agent-health.json)" = "true"
          jq -e '.mode | IN("off","shadow","pilot","on")' /tmp/order-agent-health.json >/dev/null
          jq -e '.database_configured | type=="boolean"' /tmp/order-agent-health.json >/dev/null
          jq -e '.model_configured | type=="boolean"' /tmp/order-agent-health.json >/dev/null
          jq -e '.webhook_configured | type=="boolean"' /tmp/order-agent-health.json >/dev/null
          jq -e '.pilot_customer_count | type=="number"' /tmp/order-agent-health.json >/dev/null

          LIBRARY_CODE="$(curl --silent --show-error --output /tmp/library.json --write-out '%{http_code}' \
            -H "apikey: $KEY" \
            "$API/api/library?view=search&limit=10&include_hidden=1")"
          if [ "$LIBRARY_CODE" != "200" ]; then
            echo "Library HTTP $LIBRARY_CODE"
            cat /tmp/library.json
            exit 1
          fi
          jq '{products:(.products|length),role:.role}' /tmp/library.json
          jq -e '.products | type=="array"' /tmp/library.json >/dev/null
          test "$(jq -r '.role' /tmp/library.json)" = "user"
          jq -e 'all(.products[]; has("supplier_input_price_vnd")|not)' /tmp/library.json >/dev/null
          jq -e 'all(.products[]; has("supplier_expected_profit_vnd")|not)' /tmp/library.json >/dev/null
          jq -e 'all(.products[]; has("supplier_applied_profit_vnd")|not)' /tmp/library.json >/dev/null

          CODE="$(curl --silent --output /tmp/source-manager.json --write-out '%{http_code}' \
            -H "apikey: $KEY" \
            "$API/api/library?view=source-manager")"
          test "$CODE" = "401"
          test "$(jq -r '.error' /tmp/source-manager.json)" = "admin_locked"

      - name: Reject customer GETLINK without admin session
        shell: bash
        run: |
          set -euo pipefail
          API="$(sed -n 's/^window.GETLINK_API_BASE="\([^"]*\)";/\1/p' config.js)"
          KEY="$(sed -n 's/^window.GETLINK_API_KEY="\([^"]*\)";/\1/p' config.js)"
          CODE="$(curl --silent --output /tmp/get-price.json --write-out '%{http_code}' \
            -H "apikey: $KEY" \
            -H 'origin: https://get.taphoa.xyz' \
            -H 'content-type: application/json' \
            -X POST "$API/api/get-price" \
            --data '{"url":"https://bachhoaxanh.com/"}')"
          test "$CODE" = "401"
          test "$(jq -r '.error' /tmp/get-price.json)" = "admin_locked"

      - name: Reject untrusted write
        shell: bash
        run: |
          set -euo pipefail
          API="$(sed -n 's/^window.GETLINK_API_BASE="\([^"]*\)";/\1/p' config.js)"
          KEY="$(sed -n 's/^window.GETLINK_API_KEY="\([^"]*\)";/\1/p' config.js)"
          CODE="$(curl --silent --output /tmp/write.json --write-out '%{http_code}' \
            -H "apikey: $KEY" \
            -H 'content-type: application/json' \
            -X POST "$API/api/preference" \
            --data '{}')"
          test "$CODE" = "403"
