name: Smoke WinMart
# direct Worker benchmark

on:
  push:
    paths:
      - ".github/workflows/smoke-winmart.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Benchmark GET link tổng WinMart
        env:
          API: "https://getlink-api.taphoa-4ab8161d.workers.dev"
          SAMPLE: "https://winmart.vn/sua-cac-loai--c08?storeCode=1535"
        run: |
          set -euo pipefail
          START="$(date +%s)"
          curl --fail --silent --show-error "$API/health" | jq .

          HTTP_CODE="$(curl --silent --show-error             --connect-timeout 20 --max-time 30             -o /tmp/winmart-create.json             -w '%{http_code}'             -H 'Origin: https://get.taphoa.xyz'             -H 'Content-Type: application/json'             -X POST "$API/api/get-price"             --data "$(jq -nc --arg url "$SAMPLE" '{url:$url,force:true}')")"

          cat /tmp/winmart-create.json | jq .
          test "$HTTP_CODE" -ge 200
          test "$HTTP_CODE" -lt 300
          RID="$(jq -r '.request_id // empty' /tmp/winmart-create.json)"
          test -n "$RID"

          for i in $(seq 1 90); do
            sleep 1
            curl --fail --silent --show-error               -H 'Origin: https://get.taphoa.xyz'               "$API/api/result?id=$RID" > /tmp/winmart-result.json
            STATUS="$(jq -r '.status // empty' /tmp/winmart-result.json)"
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" = "complete" ]; then
              break
            fi
            if [ "$STATUS" = "error" ]; then
              cat /tmp/winmart-result.json | jq .
              exit 1
            fi
            if [ "$i" = "90" ]; then
              cat /tmp/winmart-result.json | jq .
              exit 1
            fi
          done

          END="$(date +%s)"
          ELAPSED="$((END-START))"
          RAW_COUNT="$(jq '.payload.products|length' /tmp/winmart-result.json)"
          RAW_TYPE_COUNT="$(jq '[.payload.products[]|select(((.packaging.text // "")|tostring|length)>0)]|length' /tmp/winmart-result.json)"
          RAW_CLASSIFIED_COUNT="$(jq '[.payload.products[]|select(
            ((.hierarchy.label1 // "") != "") or
            ((.hierarchy.label2 // "") != "") or
            ((.hierarchy.label3 // "") != "")
          )]|length' /tmp/winmart-result.json)"

          echo "elapsed_seconds=$ELAPSED raw_products=$RAW_COUNT raw_types=$RAW_TYPE_COUNT classified=$RAW_CLASSIFIED_COUNT"
          test "$RAW_COUNT" -eq 298
          test "$RAW_TYPE_COUNT" -eq 298
          test "$RAW_CLASSIFIED_COUNT" -eq 0

          jq '[.payload.products[0:5][] | {
            name,
            type:(.packaging.text // ""),
            price:(.price.current // null),
            original:(.price.original // null),
            size_value:(.comparison.size_value // null),
            size_unit:(.comparison.size_unit // ""),
            url
          }]' /tmp/winmart-result.json

          curl --fail --silent --show-error             -H 'Origin: https://get.taphoa.xyz'             "$API/api/library?view=search&limit=2000&include_hidden=1"             > /tmp/library.json

          WM_COUNT="$(jq '[.products[]|select(.source=="WinMart")]|length' /tmp/library.json)"
          WM_TYPE_COUNT="$(jq '[.products[]|select(.source=="WinMart" and (((.packaging // "")|tostring|length)>0))]|length' /tmp/library.json)"
          WM_CLASSIFIED="$(jq '[.products[]|select(
            .source=="WinMart" and (
              ((.pack_label_1 // "") != "") or
              ((.pack_label_2 // "") != "") or
              ((.pack_label_3 // "") != "")
            )
          )]|length' /tmp/library.json)"

          echo "library_winmart=$WM_COUNT library_raw_types=$WM_TYPE_COUNT library_classified=$WM_CLASSIFIED"
          test "$WM_COUNT" -eq 298
          test "$WM_TYPE_COUNT" -eq 298
          test "$WM_CLASSIFIED" -eq 0
