name: Stamp Chat-sourced GETLINK access once

on:
  push:
    branches:
      - feature/chat-identity-admin-sales

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-identity-admin-sales
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Commit stamp and remove one-time workflow
        run: |
          rm .github/workflows/stamp-chat-sourced-access-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json .github/workflows/stamp-chat-sourced-access-once.yml
          git commit -m "Stamp Chat-sourced GETLINK build"
          git push
