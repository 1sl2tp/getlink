name: Stamp hot-path branch

on:
  push:
    branches:
      - perf/taphoa-hot-paths-scroll

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/taphoa-hot-paths-scroll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Commit stamp when needed
        run: |
          if git diff --quiet -- index.html version.json; then
            echo 'Static stamp is current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'chore: stamp static build'
          git push origin HEAD:perf/taphoa-hot-paths-scroll
