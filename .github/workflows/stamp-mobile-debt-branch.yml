name: Stamp mobile debt feature build

permissions:
  contents: write

on:
  push:
    branches:
      - feature/mobile-debt-payment-control
    paths:
      - ".github/workflows/stamp-mobile-debt-branch.yml"

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-debt-payment-control
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp static build
        run: |
          set -euo pipefail
          python tools/stamp_static_build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: stamp static build"
          git push origin HEAD:feature/mobile-debt-payment-control
