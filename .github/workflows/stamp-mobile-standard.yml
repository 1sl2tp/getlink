name: Stamp mobile standard build

on:
  push:
    branches:
      - feature/taphoa-mobile-standard-sales
    paths:
      - .github/workflows/stamp-mobile-standard.yml

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taphoa-mobile-standard-sales
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify focused mobile contract
        run: |
          python -m unittest tests.test_taphoa_mobile_standard_sales -v
          node --check taphoa-mobile-standard.js
      - name: Stamp static build
        run: |
          python tools/stamp_static_build.py
          python tools/stamp_static_build.py --check
      - name: Commit build metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "build: stamp mobile standard sales"
          git push origin HEAD:feature/taphoa-mobile-standard-sales
