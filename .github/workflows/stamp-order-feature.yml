name: Stamp order feature build

permissions:
  contents: write

on:
  push:
    branches:
      - feature/order-management

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/order-management
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/stamp_static_build.py
      - name: Commit stamp
        run: |
          if git diff --quiet -- index.html version.json; then
            echo "Build stamp already current"
            exit 0
          fi
          git config user.name "GETLINK Build Stamp"
          git config user.email "actions@users.noreply.github.com"
          git add index.html version.json
          git commit -m "build: stamp order manager assets"
          git push origin HEAD:feature/order-management
