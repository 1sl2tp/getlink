name: Stamp order workspace

on:
  push:
    branches:
      - fix/order-workspace-layout-scroll

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-workspace-layout-scroll
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/stamp_static_build.py
      - name: Commit stamp when needed
        run: |
          if git diff --quiet -- index.html version.json; then
            echo 'Static build stamp already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'chore: stamp order workspace build'
          git push origin HEAD:fix/order-workspace-layout-scroll
