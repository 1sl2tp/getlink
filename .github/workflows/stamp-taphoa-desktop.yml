name: Stamp Tạp hóa desktop branch

on:
  push:
    branches:
      - feature/taphoa-desktop-three-column-rebuild

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/taphoa-desktop-three-column-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp build
        run: python tools/stamp_static_build.py
      - name: Commit stamp when changed
        run: |
          if git diff --quiet -- index.html version.json; then
            echo 'Build stamp already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'build: stamp Tạp hóa desktop branch'
          git push origin HEAD:feature/taphoa-desktop-three-column-rebuild
