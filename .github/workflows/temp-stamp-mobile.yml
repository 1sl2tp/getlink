name: Temp stamp mobile debt branch

permissions:
  contents: write

on:
  push:
    branches:
      - feature/mobile-debt-actions
    paths:
      - "taphoa-mobile-standard.js"
      - ".github/workflows/temp-stamp-mobile.yml"

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-debt-actions
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Commit stamp if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html version.json; then
            echo "Static build already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "chore: stamp mobile debt build"
          git push origin HEAD:feature/mobile-debt-actions
