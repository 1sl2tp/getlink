name: Verify GETLINK

permissions:
  contents: write

concurrency:
  group: verify-getlink-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: One-time static build stamp for desktop layout branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/taphoa-desktop-layout-v2'
        run: |
          python tools/stamp_static_build.py
          if ! git diff --quiet -- index.html version.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html version.json
            git commit -m "build: stamp desktop layout assets"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
      - run: python tools/stamp_static_build.py --check
      - run: python -m unittest tests.test_chat_order_source_handoff -v
      - run: python -m unittest discover -s tests -v
      - run: python -W error::SyntaxWarning -m py_compile scraper/scraper.py scraper/brightdata_bhx.py scraper/brightdata_go.py
      - run: node --check app.js
      - run: node --check order-management.js
      - run: node --check taphoa-desktop-workspace.js
      - run: node --check taphoa-desktop-data.js
      - run: node --check taphoa-desktop-sales.js
      - run: node --check taphoa-desktop-orders.js
      - run: node --check taphoa-desktop-debts.js
      - run: node --check taphoa-workspace-feedback.js
      - run: node --check relay/src/index.js
      - run: node tests/test_taphoa_desktop_hot_paths.mjs
      - run: node tests/test_taphoa_desktop_layout_v2.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/getlink-api/index.ts
      - run: deno check supabase/functions/getlink-orders/index.ts
      - run: deno check supabase/functions/getlink-product-add/index.ts
      - run: deno check supabase/functions/getlink-order-customer/index.ts
      - run: node tests/test_money_display.mjs
      - run: node tests/test_bhx_edge_contract.mjs
      - run: node tests/test_go_edge_contract.mjs
      - run: node tests/test_getlink_name_filter_contract.mjs
      - name: Supabase-only gate
        run: |
          grep -q 'supabase.co/functions/v1/getlink-api' config.js
          ! grep -q 'workers.dev' config.js
          test -f supabase/functions/getlink-api/index.ts
          test -f supabase/functions/getlink-orders/index.ts
          test -f supabase/functions/getlink-product-add/index.ts
          test -f supabase/functions/getlink-order-customer/index.ts
