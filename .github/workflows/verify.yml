name: Verify GETLINK

permissions:
  contents: write

concurrency:
  group: verify-getlink-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  patch-order-regression:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/order-source-left-owner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch scoped order workspace owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text('utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}')
              if text.count(old)!=1:
                  raise SystemExit(f'expected one block in {path}, found {text.count(old)}')
              p.write_text(text.replace(old,new,1),'utf-8')

          replace_once('taphoa-workspace-feedback.js', '''  function renderOrderWorkspaceSelection(){
            const workspace=document.querySelector(".order-workspace-v2");
            if(!workspace)return;
            const ids=[...workspace.querySelectorAll("[data-order-list-item]")].map(row=>String(row.dataset.orderId||""));
            if(orderWorkspaceSelectedId&&!ids.includes(orderWorkspaceSelectedId))orderWorkspaceSelectedId="";
            const wide=window.matchMedia("(min-width:1000px)").matches;
            if(wide&&!orderWorkspaceSelectedId&&ids.length)orderWorkspaceSelectedId=ids[0];
            workspace.classList.toggle("has-selection",Boolean(orderWorkspaceSelectedId));
            workspace.querySelectorAll("[data-order-list-item]").forEach((row,index)=>{
              const selected=String(row.dataset.orderId||"")===orderWorkspaceSelectedId;
              row.classList.toggle("selected",selected);
              row.setAttribute("aria-pressed",selected?"true":"false");
              const order=orderCache.get(String(row.dataset.orderId||""));
              if(order){
                const refreshed=document.createElement("template");
                refreshed.innerHTML=orderIndexCardMarkup(order,index,selected);
                const next=refreshed.content.firstElementChild;
                if(next)row.replaceWith(next);
              }
            });
            const detail=workspace.querySelector(".order-detail-pane");
            if(!detail)return;
            const index=ids.indexOf(orderWorkspaceSelectedId);
            const order=index>=0?orderCache.get(orderWorkspaceSelectedId):null;
            detail.innerHTML=orderInvoiceMarkup(order,index>=0?index:0);
          }
          ''', '''  function renderOrderWorkspaceSelection(){
            const workspace=document.querySelector(".order-workspace-v2");
            if(!workspace)return;
            const rows=[...workspace.querySelectorAll("[data-order-list-item]")];
            const ids=rows.map(row=>String(row.dataset.orderId||""));
            if(orderWorkspaceSelectedId&&!ids.includes(orderWorkspaceSelectedId))orderWorkspaceSelectedId="";
            const wide=window.matchMedia("(min-width:1000px)").matches;
            if(wide&&!orderWorkspaceSelectedId&&ids.length)orderWorkspaceSelectedId=ids[0];
            workspace.classList.toggle("has-selection",Boolean(orderWorkspaceSelectedId));
            rows.forEach(row=>{
              const selected=String(row.dataset.orderId||"")===orderWorkspaceSelectedId;
              row.classList.toggle("selected",selected);
              row.setAttribute("aria-pressed",selected?"true":"false");
            });
            const detail=workspace.querySelector(".order-detail-pane");
            if(!detail)return;
            const index=ids.indexOf(orderWorkspaceSelectedId);
            const order=index>=0?orderCache.get(orderWorkspaceSelectedId):null;
            detail.innerHTML=orderInvoiceMarkup(order,index>=0?index:0);
          }
          ''')

          replace_once('taphoa-workspace-feedback.js', '''    workspace.innerHTML='<aside class="order-index-pane"><div class="order-index-scroll">'+
          '<div class="order-index-list">'+rows.map((order,index)=>orderIndexCardMarkup(order,index,String(order.id)===orderWorkspaceSelectedId)).join('')+'</div>'+
          '</div></aside><div class="order-detail-pane"></div>';
          ''', '''    workspace.innerHTML='<aside class="order-index-pane"><div class="order-index-pane-head">Danh sách đơn</div><div class="order-index-scroll">'+
          '<div class="order-index-list">'+rows.map((order,index)=>orderIndexCardMarkup(order,index,String(order.id)===orderWorkspaceSelectedId)).join('')+'</div>'+
          '</div></aside><div class="order-detail-pane"></div>';
          ''')

          replace_once('taphoa-hot-path-runtime.js', '''  function moveOrderSourceLeft(){
            const nav=document.getElementById("workspaceNav");
            const manager=document.getElementById("orderManager");
            if(!nav)return;
            let slot=nav.querySelector(".taphoa-source-left-slot");
            if(!slot){
              slot=document.createElement("div");
              slot.className="taphoa-source-left-slot";
              slot.hidden=true;
              nav.appendChild(slot);
            }
            const fresh=document.querySelector(".order-workspace-v2 .order-source-report");
            if(fresh&&fresh.parentElement!==slot)slot.replaceChildren(fresh);
            const report=fresh||slot.querySelector(".order-source-report");
            const visible=Boolean(manager&&!manager.hidden&&manager.getClientRects().length&&report);
            slot.hidden=!visible;
          }

          function installSourceRailWatcher(){
            if(sourceRailObserver)return;
            const host=document.querySelector(".workspace-list");
            if(host){
              sourceRailObserver=new NativeMutationObserver(()=>requestAnimationFrame(moveOrderSourceLeft));
              sourceRailObserver.observe(host,{subtree:true,childList:true,attributes:true,attributeFilter:["hidden","class"]});
            }
            document.addEventListener("click",()=>requestAnimationFrame(moveOrderSourceLeft),true);
            moveOrderSourceLeft();
          }
          ''', '''  function moveOrderSourceLeft(){
            const desktop=document.querySelector(".user-work-desktop");
            const left=document.getElementById("userWorkDesktopCategories");
            const manager=document.getElementById("orderManager");
            if(!desktop||!left)return;
            let slot=left.querySelector(".taphoa-source-left-slot");
            if(!slot){
              slot=document.createElement("div");
              slot.className="taphoa-source-left-slot";
              slot.hidden=true;
              left.appendChild(slot);
            }
            const ordersActive=desktop.dataset.taphoaView==="orders";
            if(ordersActive&&left.hidden)left.hidden=false;
            const fresh=document.querySelector(".order-workspace-v2 .order-source-report");
            if(fresh&&fresh.parentElement!==slot)slot.replaceChildren(fresh);
            const report=fresh||slot.querySelector(".order-source-report");
            const shouldHide=!Boolean(ordersActive&&manager&&!manager.hidden&&manager.getClientRects().length&&report);
            if(slot.hidden!==shouldHide)slot.hidden=shouldHide;
          }

          function installSourceRailWatcher(){
            if(sourceRailObserver)return;
            const host=document.querySelector(".user-work-desktop");
            if(host){
              sourceRailObserver=new NativeMutationObserver(records=>{
                const relevant=records.some(record=>{
                  const target=elementTarget(record);
                  return !target?.closest?.(".order-detail-pane,.order-index-list");
                });
                if(relevant)requestAnimationFrame(moveOrderSourceLeft);
              });
              sourceRailObserver.observe(host,{subtree:true,childList:true,attributes:true,attributeFilter:["hidden","class","data-taphoa-view"]});
            }
            document.addEventListener("click",()=>requestAnimationFrame(moveOrderSourceLeft),true);
            moveOrderSourceLeft();
          }
          ''')

          replace_once('order-management.js', '      if(categories)categories.hidden=!sales;\n', '      if(categories)categories.hidden=!(sales||taphoaWorkView==="orders");\n')

          replace_once('taphoa-hot-path-runtime.css', '''@media (min-width:1000px){
            #workspaceNav{min-height:0;display:flex;flex-direction:column}
            #workspaceNav .category-tabs{min-height:0;overflow:auto}
            #workspaceNav .taphoa-source-left-slot{flex:1 1 auto;max-height:48vh}
          }
          ''', '''@media (min-width:1000px){
            .user-work-desktop[data-taphoa-view="orders"] #userWorkDesktopCategories{
              min-height:0;
              display:flex!important;
              flex-direction:column;
              overflow:auto!important;
              padding:0 8px 8px!important;
            }
            .user-work-desktop[data-taphoa-view="orders"] #userWorkDesktopCategories>:not(.taphoa-source-left-slot){display:none!important}
            .user-work-desktop[data-taphoa-view="orders"] #userWorkDesktopCategories .taphoa-source-left-slot{
              flex:1 1 auto;
              min-height:0;
              margin-top:0;
              overflow:auto;
            }
          }
          ''')

          p=Path('taphoa-order-workspace-v2.css')
          css=p.read_text('utf-8')
          marker='/* ORDER_LIST_DETAIL_SPLIT_20260914 */'
          if marker not in css:
              css += '''\n\n/* ORDER_LIST_DETAIL_SPLIT_20260914 */
          .order-index-pane{display:flex!important;flex-direction:column!important}
          .order-index-pane-head{
            flex:0 0 auto;
            min-height:34px;
            padding:0 11px;
            border-bottom:1px solid #dfe5e1;
            background:#f3f7f5;
            color:#617068;
            display:flex;
            align-items:center;
            font-size:10.5px;
            font-weight:700;
            letter-spacing:.04em;
            text-transform:uppercase;
          }
          .order-index-scroll{flex:1 1 auto!important;height:auto!important;min-height:0!important}
          .order-detail-pane{box-shadow:inset 1px 0 0 #eef1ef}
          '''
              p.write_text(css,'utf-8')
          PY
      - name: Stamp static build
        run: python tools/stamp_static_build.py
      - name: Focused regression check
        run: |
          python -m unittest tests.test_taphoa_hot_path_performance -v
          node --check taphoa-hot-path-runtime.js
          node --check taphoa-workspace-feedback.js
          node --check order-management.js
          python tools/stamp_static_build.py --check
      - name: Commit branch patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add taphoa-workspace-feedback.js taphoa-hot-path-runtime.js taphoa-hot-path-runtime.css taphoa-order-workspace-v2.css order-management.js index.html version.json
          git commit -m "Fix order list click hot path and source rail owner"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  verify:
    needs: patch-order-regression
    if: always() && (needs.patch-order-regression.result == 'success' || needs.patch-order-regression.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python tools/stamp_static_build.py --check
      - run: python -m unittest tests.test_chat_order_source_handoff -v
      - run: python -m unittest discover -s tests -v
      - run: python -W error::SyntaxWarning -m py_compile scraper/scraper.py scraper/brightdata_bhx.py scraper/brightdata_go.py
      - run: node --check app.js
      - run: node --check order-management.js
      - run: node --check taphoa-workspace-feedback.js
      - run: node --check relay/src/index.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/getlink-api/index.ts
      - run: deno check supabase/functions/getlink-orders/index.ts
      - run: deno check supabase/functions/getlink-product-add/index.ts
      - run: deno check supabase/functions/getlink-order-customer/index.ts
      - run: node tests/test_money_display.mjs
      - run: node tests/test_bhx_edge_contract.mjs
      - run: node tests/test_go_edge_contract.mjs
      - run: node tests/test_getlink_name_filter_contract.mjs
      - name: Supabase-only gate
        run: |
          grep -q 'supabase.co/functions/v1/getlink-api' config.js
          ! grep -q 'workers.dev' config.js
          test -f supabase/functions/getlink-api/index.ts
          test -f supabase/functions/getlink-orders/index.ts
          test -f supabase/functions/getlink-product-add/index.ts
          test -f supabase/functions/getlink-order-customer/index.ts
