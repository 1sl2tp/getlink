name: Verify GETLINK

permissions:
  contents: read

concurrency:
  group: verify-getlink-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python tools/stamp_static_build.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -W error::SyntaxWarning -m py_compile scraper/scraper.py scraper/brightdata_bhx.py scraper/brightdata_go.py
      - run: node --check app.js
      - run: node --check order-management.js
      - run: node --check relay/src/index.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/getlink-api/index.ts
      - run: deno check supabase/functions/getlink-orders/index.ts
      - run: deno test -A tests/ai_sales_order_agent_test.ts tests/ai_sales_order_session_test.ts
      - run: deno check supabase/functions/getlink-order-agent/index.ts
      - run: node tests/test_money_display.mjs
      - run: node tests/test_bhx_edge_contract.mjs
      - run: node tests/test_go_edge_contract.mjs
      - run: node tests/test_getlink_name_filter_contract.mjs
      - name: Supabase-only gate
        run: |
          grep -q 'supabase.co/functions/v1/getlink-api' config.js
          ! grep -q 'workers.dev' config.js
          test -f supabase/functions/getlink-api/index.ts
          test -f supabase/functions/getlink-orders/index.ts
          test -f supabase/functions/getlink-order-agent/index.ts
