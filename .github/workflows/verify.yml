name: Verify GETLINK

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scraper/brightdata_bhx.py scraper/brightdata_go.py
      - run: node --check app.js
      - run: node --check worker/src/index.js
      - run: node tests/test_pack_parser.mjs
      - run: node tests/test_go_parser.mjs
      - run: node tests/test_money_display.mjs
