name: Vinamilk browser probe

on:
  push:
    branches:
      - feat/vinamilk-concung-sources
    paths:
      - .github/workflows/vinamilk-browser-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Vinamilk static assets
        shell: bash
        run: |
          node <<'NODE'
          const urls = [
            'https://www.vinamilk.com.vn/_next/static/chunks/3893-516714ed7d90043f.js',
            'https://www.vinamilk.com.vn/_next/static/chunks/2878-361b54eb6ab1d6fb.js',
            'https://www.vinamilk.com.vn/_next/static/PLIMgmRUYT9GNHUiKuRcf/_buildManifest.js',
            'https://www.vinamilk.com.vn/_next/static/PLIMgmRUYT9GNHUiKuRcf/_ssgManifest.js'
          ];
          for (const url of urls) {
            try {
              const r = await fetch(url, {
                headers: {'user-agent':'Mozilla/5.0','accept':'*/*'}
              });
              const body = await r.text();
              console.log('\nURL', url);
              console.log('status=', r.status, 'type=', r.headers.get('content-type'), 'length=', body.length);
              console.log('has-getClientInfos=', body.includes('getClientInfos'));
              console.log('has-VNM_SIGNATURE_SALT=', body.includes('VNM_SIGNATURE_SALT'));
              console.log('has-module-10059=', /(?:^|[,;{])10059\s*:/.test(body));
              if (/Manifest/.test(url)) console.log('sample=', body.slice(0,1800));
              if (body.includes('getClientInfos')) {
                const i=body.indexOf('getClientInfos');
                console.log('getClientInfos-snippet=', body.slice(Math.max(0,i-900),i+2200));
              }
            } catch(e) {
              console.log('\nURL', url, 'ERROR', String(e));
            }
          }
          NODE
