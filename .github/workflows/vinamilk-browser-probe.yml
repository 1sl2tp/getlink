name: Vinamilk browser probe

on:
  push:
    branches:
      - feat/vinamilk-concung-sources
    paths:
      - .github/workflows/vinamilk-browser-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Open Vinamilk in headless Chrome
        shell: bash
        run: |
          set -o pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          echo "chrome=$CHROME"
          test -n "$CHROME"
          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --lang=vi-VN             --window-size=1365,900             --virtual-time-budget=12000             --dump-dom             'https://www.vinamilk.com.vn/collections/sua-tuoi?src=ALL' > /tmp/vnm.html
          echo "bytes=$(wc -c </tmp/vnm.html)"
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/vnm.html','utf8');
          console.log('has-green-farm=', /Green\s*Farm/i.test(html));
          console.log('has-cloudfront=', /cloudfront\.net/i.test(html));
          console.log('has-vnd=', /₫|VND|đ/i.test(html));
          const text = html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ');
          const m = text.match(/.{0,220}Green\s*Farm.{0,500}/i);
          console.log('green-farm-text=', m ? m[0] : 'NONE');
          const imgs=[...html.matchAll(/https:\/\/[^"'<>\s]+cloudfront\.net\/[^"'<>\s]+/ig)].map(x=>x[0]);
          console.log('cloudfront-sample=', [...new Set(imgs)].slice(0,3));
          NODE
