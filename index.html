<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GETLINK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header>
    <div class="logo">GL</div>
    <div><h1>GETLINK</h1><p>Lấy giá Bách Hóa XANH từ link sản phẩm</p></div>
  </header>

  <section class="card">
    <label for="url">Link sản phẩm</label>
    <div class="input-row">
      <input id="url" autocomplete="off" placeholder="https://www.bachhoaxanh.com/...">
      <button id="get" type="button">Lấy giá</button>
    </div>
    <div id="status" class="status">Dán link sản phẩm rồi bấm Lấy giá.</div>
    <div class="steps" id="steps" hidden>
      <b>GitHub Actions đã mở.</b> Link đã được copy; dán vào ô URL → Run workflow. Khi quay lại đây, trang sẽ tự kiểm tra kết quả.
    </div>
  </section>

  <section class="card result" id="result" hidden>
    <div class="result-head">
      <div>
        <small id="source">Bách Hóa XANH</small>
        <h2 id="name"></h2>
      </div>
      <a id="productLink" target="_blank" rel="noopener">Mở link</a>
    </div>

    <div class="meta-grid">
      <div><small>Nhóm</small><strong id="group">—</strong></div>
      <div><small>Nhánh</small><strong id="branch">—</strong></div>
      <div><small>Quy cách</small><strong id="packaging">—</strong></div>
    </div>

    <div class="price-grid">
      <div class="price"><small>1 · Giá của họ</small><strong id="webPrice">—</strong></div>
      <div class="price promo"><small>2 · Ưu đãi</small><strong id="promoPrice">—</strong><span id="promoText"></span></div>
      <div class="price mine"><small>3 · Giá của mình</small><input id="myPrice" inputmode="numeric" placeholder="Nhập giá"></div>
    </div>

    <label class="watch"><input id="watch" type="checkbox"> Theo dõi sản phẩm này</label>
    <div id="compare" class="compare"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
